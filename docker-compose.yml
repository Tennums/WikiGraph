# Wikigraph — the disc, the graph API, and the article reader.
#
# All state lives on the NAS under DATA_DIR; the containers hold nothing of their own,
# so they can be rebuilt or moved without touching the graph.
#
#   cp .env.example .env      # then set WIKI / ZIM_BOOK / KIWIX_URL
#   docker compose --profile ingest run --rm ingest   # one-off, hours for enwiki
#   docker compose up -d
#
# Ingress is Caddy's, over the shared external `proxy` network, on one hostname:
#
#     https://wikigraph.docker.home.arpa/         the disc
#     https://wikigraph.docker.home.arpa/kiwix/   the articles
#
# Both web-facing services carry an explicit container_name. On a shared network the
# compose service alias is just `api`, which any other stack on that network can also
# claim, and whichever container Caddy resolves first wins; the explicit name is what
# makes the Caddyfile target unambiguous. See README for the Caddyfile block.

name: wikigraph

services:
  # The interface plus the subgraph API. Reads the CSR and SQLite the ingest produced;
  # it never writes, so it is safe to run several against one NAS copy.
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    container_name: wikigraph
    restart: unless-stopped
    # Caddy reaches this over the proxy network, so nothing is published on the host.
    # Uncomment to bypass the proxy while debugging.
    # ports: ["${API_PORT:-3000}:3000"]
    environment:
      WIKI: ${WIKI:-simplewiki}
      GRAPH_DIR: /data/graph
      WEB_DIR: /web
      # Where the *browser* reaches Kiwix — the hostname and prefix, since the link is
      # followed by the reader's machine, which can resolve neither the compose service
      # name nor localhost. Must match kiwix-serve's -r below.
      KIWIX_URL: ${KIWIX_URL:-https://wikigraph.docker.home.arpa/kiwix}
      KIWIX_BOOK: ${ZIM_BOOK:-}
      # The renderer re-plans its whole layout every animated frame; upstream measured
      # 10k nodes at 14 fps. Raising this past ~6000 trades the animation for size.
      MAX_NODES: ${MAX_NODES:-6000}
    volumes:
      - ${DATA_DIR:-/media/vault/WikiGraph}/graph:/data/graph:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reading layer. Hot-reloads whatever ZIMs are in the directory, and brings its own
  # full-text search, so no article content ever goes through the API above.
  kiwix:
    image: ghcr.io/kiwix/kiwix-tools:latest
    container_name: wikigraph-kiwix
    restart: unless-stopped
    # Flags only. The image's entrypoint is a start.sh that runs
    # `kiwix-serve --port=$PORT "$@"` itself, so a command starting with `kiwix-serve`
    # hands the binary its own name as a positional argument, which it reads as a ZIM
    # path that does not exist -- and the container restarts in a loop, which Caddy
    # reports as a 502. PORT defaults to 8080 inside the script.
    #
    # -r tells kiwix-serve the prefix it is mounted under, so every link and asset it
    # generates is written /kiwix/... . Caddy passes the prefix through untouched
    # rather than stripping it; strip it and kiwix's own absolute URLs break on the
    # first click.
    #
    # The ZIM is given directly rather than through a library.xml: one file, one
    # setting (ZIM_BOOK, which the API needs anyway), and no kiwix-manage step to
    # forget. kiwix-serve derives the book name from the filename exactly as the API
    # expects, so the two cannot drift.
    # Not `${ZIM_BOOK:?}`: compose interpolates the whole file before it filters
    # profiles, so a hard failure here would also break `up -d` for someone who has
    # no ZIM yet. A missing file instead shows up by name in `logs kiwix`.
    command: ["--urlRootLocation", "/kiwix", "/zim/${ZIM_BOOK:-SET_ZIM_BOOK_IN_DOTENV}.zim"]
    # As above: Caddy fronts this. Uncomment only to bypass it.
    # ports: ["${KIWIX_PORT:-8080}:8080"]
    volumes:
      - ${ZIM_DIR:-/media/vault/WikiGraph/zim}:/zim:ro
    networks:
      - proxy
    profiles: ["kiwix"]

  # One-off: dumps in, graph out. Not part of `up`; run it explicitly.
  #
  # Deliberately off the proxy network — it serves nothing and never needs to be
  # reachable. It only reads the dumps and writes the graph, both on the NAS.
  #
  # enwiki is a long job: the pagelinks dump alone is ~7 GB compressed and holds ~1.6
  # billion rows. Measured: just under two hours, ~730M links, a 2.9 GB CSR.
  #
  # SCRATCH_DIR must be on LOCAL disk, never the NAS. SQLite coordinates through POSIX
  # advisory locks that network filesystems do not reliably provide, so building the
  # database on the share fails with "database is locked" on a file nothing else has
  # open — and it fails at the very end, after the expensive half has already run. The
  # finished database is moved to the NAS once it is complete.
  #
  # Needs ~15 GB free for enwiki: ~6 GB edge scratch plus the database being built.
  ingest:
    build: { context: ., dockerfile: ingest/Dockerfile }
    container_name: wikigraph-ingest
    command: ["--wiki", "${WIKI:-simplewiki}"]
    environment:
      WIKIGRAPH_TMPDIR: /scratch
    volumes:
      - ${DATA_DIR:-/media/vault/WikiGraph}/dumps:/data/dumps:ro
      - ${DATA_DIR:-/media/vault/WikiGraph}/graph:/data/graph
      - ${SCRATCH_DIR:-wikigraph-scratch}:/scratch
      # The working tree wins over the copy baked into the image. `docker compose run`
      # reuses an existing image without rebuilding, so without this an edit to
      # build.py is silently ignored and you debug the previous version -- which for a
      # two-hour job is an expensive way to find out. The Dockerfile still COPYs the
      # source, so the image also works on its own.
      - ./ingest:/app/ingest:ro
    network_mode: none
    profiles: ["ingest"]

# Local scratch for the ingest. A named volume lives on the Docker host's own disk,
# which is what this needs; override SCRATCH_DIR with a host path to put it elsewhere.
volumes:
  wikigraph-scratch:

networks:
  proxy:
    external: true
