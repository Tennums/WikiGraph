/**
 * The disc as a table. Same articles, same visibility -- the legend's hidden wedges
 * and the date range apply, through the page's own willShow() -- as sortable rows: a
 * disc is good to see, a table to work through. A row click selects the dot and, with
 * a reader, opens the article. Redrawn after every draw while open; the rows are the
 * view data already in the page, so there is nothing to fetch.
 */
const table = {
  open: false, sort: { key: "deg", asc: false },
  COLS: [
    ["label", "Article", false],
    ["indeg", "In-links (wiki)", true],
    ["deg", "Links (disc)", true],
    ["words", "Words", true],
    ["folder", "Wedge", false],
    ["type", "Hop / role", false],
    ["kind", "Kind", false],
    ["mark", "Reading", false],
    ["touched", "Last edited", false],
  ],
  rows() {
    const d = disc.data, api = disc.api();
    if (!d || !api) return [];
    const q = $("tableFilter").value.trim().toLowerCase();
    const out = [];
    d.nodes.forEach((n, i) => {
      if (!api.willShow(String(i))) return;
      const kind = (n.tags ?? []).find((t) => !["read", "to read"].includes(t)) ?? "";
      const r = { i, label: n.label, indeg: n.indeg ?? 0, deg: n.deg, words: n.words, folder: n.folder,
                  type: n.type, kind, mark: n.mark ?? "", touched: n.touched, colour: api.colorOf(n.folder) };
      if (q && !`${r.label} ${r.folder} ${r.type} ${r.kind} ${r.mark}`.toLowerCase().includes(q)) return;
      out.push(r);
    });
    const { key, asc } = this.sort;
    const num = this.COLS.find((c) => c[0] === key)[2];
    out.sort((a, b) => {
      const c = num ? a[key] - b[key] : String(a[key]).localeCompare(String(b[key]), undefined, { numeric: true });
      return (asc ? c : -c) || a.label.localeCompare(b.label);
    });
    return out;
  },
  refresh() {
    if (!this.open) return;
    const head = $("table").querySelector("thead tr");
    head.replaceChildren(...this.COLS.map(([key, name, num]) => {
      const th = document.createElement("th");
      th.textContent = name;
      th.className = (num ? "num " : "") + (this.sort.key === key ? "on " + (this.sort.asc ? "asc" : "") : "");
      th.addEventListener("click", () => {
        this.sort = this.sort.key === key ? { key, asc: !this.sort.asc } : { key, asc: !num };
        this.refresh();
      });
      return th;
    }));
    const rows = this.rows();
    const sel = disc.api()?.state?.selected;
    const body = $("table").querySelector("tbody");
    body.replaceChildren(...rows.map((r) => {
      const tr = document.createElement("tr");
      if (String(r.i) === sel) tr.className = "sel";
      const cell = (html, cls) => { const td = document.createElement("td"); td.className = cls ?? ""; td.append(html); tr.append(td); };
      const t = document.createElement("span");
      const sw = document.createElement("i"); sw.className = "sw"; sw.style.background = r.colour;
      t.append(sw, r.label);
      cell(t, "title");
      cell(r.indeg.toLocaleString(), "num");
      cell(String(r.deg), "num");
      cell(r.words.toLocaleString(), "num");
      cell(r.folder);
      cell(r.type);
      cell(r.kind);
      const m = document.createElement("span"); m.className = `mark ${r.mark}`;
      m.textContent = r.mark === "read" ? "\u2713 read" : r.mark === "toread" ? "\u2605 to read" : "";
      cell(m);
      cell(r.touched);
      tr.addEventListener("click", () => {
        disc.api()?.select(r.label);
        body.querySelector("tr.sel")?.classList.remove("sel");
        tr.classList.add("sel");
        if (info.reader) reader.show(`${info.reader}/${encodeURIComponent(r.label.replace(/ /g, "_"))}`, r.label);
      });
      return tr;
    }));
    const n = disc.data?.nodes.length ?? 0;
    $("tableCount").textContent = rows.length === n ? `${n.toLocaleString()} articles`
                                : `${rows.length.toLocaleString()} of ${n.toLocaleString()} articles`;
  },
  show() {
    this.open = true;
    $("table").hidden = false;
    $("tableBtn").setAttribute("aria-pressed", "true");
    this.refresh();
  },
  hide() {
    this.open = false;
    $("table").hidden = true;
    $("tableBtn").setAttribute("aria-pressed", "false");
  },
  async copy() {
    const rows = this.rows();
    const lines = [`# ${disc.data.vault}`, "", `${rows.length} articles · ${location.href}`, "",
      "| Article | In-links | Links on disc | Words | Wedge | Hop / role |", "|---|---:|---:|---:|---|---|",
      ...rows.map((r) => `| ${reading.link(r.label)} | ${r.indeg} | ${r.deg} | ${r.words} | ${r.folder} | ${r.type} |`)];
    await reading.clip(lines.join("\n"), `${rows.length} rows`);
  },
};
$("tableBtn").addEventListener("click", () => (table.open ? table.hide() : table.show()));
$("tableClose").addEventListener("click", () => table.hide());
$("tableFilter").addEventListener("input", () => table.refresh());
$("tableCopy").addEventListener("click", () => table.copy());
// The legend and the date range change what the disc shows; the table follows. The
// page has no event for it, so a light poll while the table is open is the honest way.
setInterval(() => {
  if (!table.open || !disc.api()) return;
  const sig = (disc.api().state?.selected ?? "") + ":" +
              disc.data.nodes.map((n, i) => disc.api().willShow(String(i)) ? 1 : 0).join("");
  if (sig !== table.sig) { table.sig = sig; table.refresh(); }
}, 800);

/**
 * The reading list. Articles marked "to read" or "read", in localStorage like the
 * saved views. It shows in three places: on the disc as a halo (gold to read, green
 * read -- the page draws it from a `mark` on the node), on the card as a tag and a
 * pair of buttons, and in a panel that lists both groups. The reading filter is applied
 * here, to the view data, before the disc is built: the server never hears of it.
 */
const reading = {
  KEY: "wikigraph.reading",
  list() {
    try { const v = JSON.parse(localStorage.getItem(this.KEY) ?? "[]"); return Array.isArray(v) ? v : []; }
    catch { return []; }
  },
  store(items) {
    try { localStorage.setItem(this.KEY, JSON.stringify(items)); }
    catch (e) { status(`could not save: ${e.message}`, true); }
    this.render();
  },
  get(title) { return this.list().find((s) => s.title === title)?.state ?? null; },
  /** state: "toread" | "read" | null (unmark). Newest first, one entry per title. */
  set(title, state) {
    const rest = this.list().filter((s) => s.title !== title);
    this.store(state ? [{ title, state, at: new Date().toISOString() }, ...rest] : rest);
    // The dot on screen follows without a redraw: the halo is read from the node.
    const api = disc.api(), id = api?.idOf(title);
    if (id) { api.graph.setNodeAttribute(id, "mark", state); api.renderer.refresh(); }
    this.syncReaderButton();
  },
  /** Marks onto the nodes, and the filter: returns the data to mount. */
  apply(data, filter) {
    const items = this.list();
    if (!items.length) return data;
    const state = new Map(items.map((s) => [s.title, s.state]));
    for (const n of data.nodes) {
      const st = state.get(n.label);
      if (st) { n.mark = st; n.tags = [...(n.tags ?? []), st === "read" ? "read" : "to read"]; }
    }
    if (filter === "all") return data;
    const keep = filter === "unread" ? (n) => n.mark !== "read"
               : filter === "marked" ? (n) => !!n.mark
               : (n) => n.mark === "toread";
    // Pinned articles (the seed, a path's steps) are what the view is about; they stay.
    const pinned = new Set((data.pinned ?? []).map(Number));
    const map = new Map();
    const nodes = [];
    data.nodes.forEach((n, i) => { if (keep(n) || pinned.has(i)) { map.set(i, nodes.length); nodes.push(n); } });
    if (nodes.length === data.nodes.length) return data;
    const edges = data.edges.filter((e) => map.has(e.s) && map.has(e.t))
      .map((e) => ({ ...e, s: map.get(e.s), t: map.get(e.t) }));
    return {
      ...data, nodes, edges,
      pinned: (data.pinned ?? []).map((p) => map.get(Number(p))).filter((x) => x !== undefined).map(String),
      stats: { ...data.stats, files: nodes.length, nodes: nodes.length, edges: edges.length },
      readingHidden: data.nodes.length - nodes.length,
    };
  },
  /** The card's two buttons: each toggles its state; the other one is then off. */
  buttons(label, el) {
    const st = this.get(label);
    el.replaceChildren();
    for (const [state, text, tip] of [["toread", "\u2606 to read", "Keep for later"], ["read", "\u2713 read", "Done with it"]]) {
      const b = document.createElement("button");
      b.className = "btn"; b.textContent = text; b.title = tip;
      b.setAttribute("aria-pressed", String(st === state));
      b.addEventListener("click", () => { this.set(label, st === state ? null : state); this.buttons(label, el); });
      el.append(b);
    }
  },
  /** The reader bar's one button cycles: unmarked -> to read -> read -> unmarked. */
  syncReaderButton() {
    const b = $("readerMark");
    const t = reader.open ? reader.current() : "";
    b.hidden = !t;
    if (!t) return;
    const st = this.get(t);
    b.textContent = st === "read" ? "\u2713 read" : st === "toread" ? "\u2605 to read" : "\u2606 to read";
    b.classList.toggle("read", st === "read");
    b.setAttribute("aria-pressed", String(!!st));
  },
  render() {
    const items = this.list();
    $("readingBtn").textContent = items.length ? `Reading (${items.length})` : "Reading";
    $("readingEmpty").hidden = items.length > 0;
    $("readingCopy").disabled = !items.length;
    const groups = $("readingGroups");
    groups.replaceChildren();
    for (const [state, name, colour] of [["toread", "To read", "#ffd166"], ["read", "Read", "#6f8f7a"]]) {
      const rows = items.filter((s) => s.state === state);
      if (!rows.length) continue;
      const h = document.createElement("h4");
      const dot = document.createElement("i"); dot.style.background = colour;
      h.append(dot, `${name} (${rows.length})`);
      const ul = document.createElement("ul");
      for (const s of rows) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "#"; a.textContent = s.title; a.title = `Open ${s.title}`;
        a.addEventListener("click", (e) => { e.preventDefault(); this.open(s.title); });
        const flip = document.createElement("button");
        flip.textContent = state === "toread" ? "\u2713" : "\u21ba";
        flip.title = state === "toread" ? "Mark as read" : "Back to the reading list";
        flip.addEventListener("click", () => this.set(s.title, state === "toread" ? "read" : "toread"));
        const x = document.createElement("button");
        x.className = "x"; x.innerHTML = "&times;"; x.title = "Unmark";
        x.addEventListener("click", () => this.set(s.title, null));
        li.append(a, flip, x);
        ul.append(li);
      }
      groups.append(h, ul);
    }
  },
  // Open: the reader when there is one, else the disc around it.
  open(title) {
    this.hide();
    if (info.reader) reader.show(`${info.reader}/${encodeURIComponent(title.replace(/ /g, "_"))}`, title);
    else { $("view").value = "neighborhood"; $("q").value = title; syncControls(); draw(); }
  },
  show() {
    this.render();
    const p = $("readingPanel"), r = $("readingBtn").getBoundingClientRect();
    p.hidden = false;
    p.style.top = `${r.bottom + 4}px`;
    p.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - p.offsetWidth - 8))}px`;
  },
  hide() { $("readingPanel").hidden = true; },
  /**
   * Markdown for notes: a list item per article with its Kiwix link. The reading list
   * adds each article's first sentence (fetched, cached; a few dozen at most); a view
   * is too many to fetch, so it gets the topic and the link count instead.
   */
  link(title) {
    return info.reader ? `[${title}](${info.reader}/${encodeURIComponent(title.replace(/ /g, "_"))})` : `**${title}**`;
  },
  async copyList() {
    const items = this.list();
    const lines = [];
    for (const [state, name] of [["toread", "To read"], ["read", "Read"]]) {
      const rows = items.filter((s) => s.state === state);
      if (!rows.length) continue;
      lines.push(`## ${name}`, "");
      for (const s of rows.slice(0, 60)) {
        let first = "";
        if (info.reader) {
          const doc = await fetchDoc(s.title);
          const para = doc ? firstParagraph(doc) : "";
          first = para ? " — " + para.split(/(?<=[.!?])\s/)[0] : "";
        }
        lines.push(`- ${state === "read" ? "[x]" : "[ ]"} ${this.link(s.title)}${first}`);
      }
      lines.push("");
    }
    await this.clip(lines.join("\n"), `${items.length} articles`);
  },
  async copyView() {
    const d = disc.mounted?.api ? disc.data : null;
    if (!d) { status("nothing drawn yet", true); return; }
    const lines = [`# ${d.vault}`, "", `${d.nodes.length} articles · ${location.href}`, ""];
    const shown = d.nodes.map((n, i) => [n, i]).filter(([, i]) => disc.api().visible?.(String(i)) ?? true);
    shown.sort((a, b) => b[0].deg - a[0].deg);
    for (const [n] of shown) {
      lines.push(`- ${this.link(n.label)} — ${n.folder}${n.deg ? ` · ${n.deg} links` : ""}${n.mark ? ` · ${n.mark === "read" ? "read" : "to read"}` : ""}`);
    }
    await this.clip(lines.join("\n"), `${shown.length} articles`);
  },
  async clip(text, what) {
    try { await navigator.clipboard.writeText(text); status(`copied ${what} as Markdown`); }
    catch (e) { status(`clipboard refused: ${e.message}`, true); }
  },
};
$("readingBtn").addEventListener("click", () => ($("readingPanel").hidden ? reading.show() : reading.hide()));
$("readingCopy").addEventListener("click", () => reading.copyList());
$("viewCopy").addEventListener("click", () => reading.copyView());
$("reading").addEventListener("change", () => draw());
$("readerMark").addEventListener("click", () => {
  const t = reader.current();
  if (!t) return;
  const st = reading.get(t);
  reading.set(t, st === null ? "toread" : st === "toread" ? "read" : null);
});
document.addEventListener("click", (e) => {
  if (!$("readingPanel").hidden && !$("readingPanel").contains(e.target) && e.target !== $("readingBtn")) reading.hide();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") reading.hide(); });
reading.render();

/**
 * Saved views. Every view is a URL; this keeps a list of them in the browser. The star
 * saves what is on screen under the title the server gave it (the disc's heading),
 * and toggles off again if that exact view is already saved. Bringing one back is
 * setting the hash, which the back-button handler already turns into a draw. Per
 * browser and per origin -- localStorage -- so nothing goes through the API; export
 * and import as JSON is how a list moves between machines.
 */
const saved = {
  KEY: "wikigraph.saved",
  title: "",                      // of the view on screen, from the last draw
  list() {
    try { const v = JSON.parse(localStorage.getItem(this.KEY) ?? "[]"); return Array.isArray(v) ? v : []; }
    catch { return []; }
  },
  store(items) {
    try { localStorage.setItem(this.KEY, JSON.stringify(items)); }
    catch (e) { status(`could not save: ${e.message}`, true); }
    this.render();
  },
  here() { return location.hash; },
  has(hash = this.here()) { return this.list().some((s) => s.hash === hash); },
  drawn(title) { this.title = title ?? ""; this.render(); },
  toggle() {
    const hash = this.here();
    if (!hash) return;
    if (this.has(hash)) { this.store(this.list().filter((s) => s.hash !== hash)); return; }
    const title = this.title || $("q").value.trim() || $("view").selectedOptions[0].text;
    this.store([{ hash, title, at: new Date().toISOString() }, ...this.list()]);
  },
  remove(hash) { this.store(this.list().filter((s) => s.hash !== hash)); },
  open(hash) {
    this.hide();
    if (hash === location.hash) return;
    history.pushState(null, "", hash);
    readHash(); syncControls();
    draw({ push: false });
  },
  // The star reflects the view on screen; the list is redrawn from storage each time,
  // which is cheap and keeps it honest across tabs of the same browser.
  render() {
    const items = this.list();
    const on = this.has();
    $("star").classList.toggle("on", on);
    $("star").innerHTML = on ? "&#9733;" : "&#9734;";
    $("star").title = on ? "Saved — click to forget" : "Save this view in this browser";
    $("savedBtn").textContent = items.length ? `Saved (${items.length})` : "Saved";
    $("savedEmpty").hidden = items.length > 0;
    $("savedExport").disabled = !items.length;
    const here = this.here();
    $("savedList").replaceChildren(...items.map((s) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = s.hash; a.textContent = s.title; a.title = decodeURIComponent(s.hash.slice(1)).replace(/&/g, "  ");
      a.classList.toggle("here", s.hash === here);
      a.addEventListener("click", (e) => { e.preventDefault(); this.open(s.hash); });
      const when = document.createElement("small");
      when.textContent = s.at ? new Date(s.at).toLocaleDateString() : "";
      const x = document.createElement("button");
      x.innerHTML = "&times;"; x.title = "Forget this view"; x.setAttribute("aria-label", `Forget ${s.title}`);
      x.addEventListener("click", () => this.remove(s.hash));
      li.append(a, when, x);
      return li;
    }));
  },
  show() {
    this.render();
    const p = $("savedPanel"), r = $("savedBtn").getBoundingClientRect();
    p.hidden = false;
    p.style.top = `${r.bottom + 4}px`;
    p.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - p.offsetWidth - 8))}px`;
  },
  hide() { $("savedPanel").hidden = true; },
  export() {
    const blob = new Blob([JSON.stringify({ wikigraph: info.wiki ?? "", saved: this.list() }, null, 2)],
                          { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `wikigraph-${info.wiki ?? "views"}-saved.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  // Merge, keyed on the hash: what is already here stays first, the file's views
  // follow, and a view in both is not doubled.
  async import(file) {
    let items;
    try {
      const v = JSON.parse(await file.text());
      items = Array.isArray(v) ? v : v?.saved;
      if (!Array.isArray(items)) throw new Error("not a saved-views file");
    } catch (e) { status(`import failed: ${e.message}`, true); return; }
    const have = new Set(this.list().map((s) => s.hash));
    const add = items.filter((s) => s && typeof s.hash === "string" && s.hash.startsWith("#") && !have.has(s.hash))
                     .map((s) => ({ hash: s.hash, title: String(s.title ?? s.hash), at: s.at ?? new Date().toISOString() }));
    this.store([...this.list(), ...add]);
    status(`${add.length} view${add.length === 1 ? "" : "s"} imported`);
  },
};
$("star").addEventListener("click", () => saved.toggle());
$("savedBtn").addEventListener("click", () => ($("savedPanel").hidden ? saved.show() : saved.hide()));
$("savedExport").addEventListener("click", () => saved.export());
$("savedImport").addEventListener("click", () => $("savedFile").click());
$("savedFile").addEventListener("change", async (e) => {
  if (e.target.files[0]) await saved.import(e.target.files[0]);
  e.target.value = "";
});
// The list closes like a menu: a click elsewhere, or Escape.
document.addEventListener("click", (e) => {
  if (!$("savedPanel").hidden && !$("savedPanel").contains(e.target) && e.target !== $("savedBtn")) saved.hide();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") saved.hide(); });
saved.render();

readHash();
syncControls();
draw({ push: false });

// Back and forward re-read the hash and redraw, without pushing again.
window.addEventListener("popstate", () => {
  if (readHash()) { syncControls(); draw({ push: false }); }
});
</script>
</body>
</html>
