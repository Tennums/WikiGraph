<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikigraph</title>
<!-- The disc as an icon: four wedges, two rings, the pinned article in the hub. SVG
     for browsers that take it, PNG for Safari and the tab strip, a 180px plate for an
     iOS home screen. -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#14161a">
<link rel="stylesheet" href="vendor/page.css">
<style>
  /* The chrome around the disc. page.css is scoped entirely under `.vault-graph`, so
     it styles nothing out here and the shell has to size itself. */
  html, body { height: 100%; margin: 0; background: #14161a; color: #e8e8ea;
               font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }

  #bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         padding: 8px 12px; background: #1b1e24; border-bottom: 1px solid #2c313a; }
  #bar strong { color: #9fd0ff; letter-spacing: .02em; margin-right: 4px; }
  #bar label { color: #8b93a1; }
  select, input, button {
    font: inherit; background: #23272f; color: #e8e8ea;
    border: 1px solid #333944; border-radius: 5px; padding: 4px 8px;
  }
  input[type=text] { width: 220px; }
  button { cursor: pointer; }
  button:hover { background: #2c323c; }
  #hide { display: inline-flex; gap: 10px; align-items: center; padding-left: 10px;
          border-left: 1px solid #2c313a; }
  #hide label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer;
                white-space: nowrap; }
  #hide input { margin: 0; accent-color: #9fd0ff; }
  #mutualLabel { display: inline-flex; gap: 4px; align-items: center; cursor: pointer;
                 white-space: nowrap; padding-left: 10px; border-left: 1px solid #2c313a; }
  #mutualLabel input { margin: 0; accent-color: #9fd0ff; }
  #sinceLabel { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; white-space: nowrap; }
  #sinceLabel[hidden] { display: none; }
  #sinceLabel input { margin: 0; accent-color: #e0b84a; }
  #withinLabel { padding-left: 10px; border-left: 1px solid #2c313a; }
  #within { width: 160px; }
  #status { margin-left: auto; color: #8b93a1; }
  #status.err { color: #ff8b8b; }

  /* Saved views: a star that saves what is on screen, a list that brings one back. */
  #star { padding: 4px 7px; }
  #star.on { color: #ffd166; }
  #savedPanel { position: fixed; z-index: 30; min-width: 280px; max-width: 460px; max-height: 60vh;
                display: flex; flex-direction: column; background: #1b1e24; color: #e8e8ea;
                border: 1px solid #333944; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #savedPanel[hidden] { display: none; }
  #savedList { overflow-y: auto; margin: 0; padding: 4px 0; list-style: none; }
  #savedList li { display: flex; align-items: center; gap: 6px; padding: 0 6px; }
  #savedList li:hover { background: #23272f; }
  #savedList a { flex: 1; min-width: 0; padding: 5px 4px; color: #e8e8ea; text-decoration: none;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #savedList a.here { color: #9fd0ff; }
  #savedList small { color: #8b93a1; white-space: nowrap; }
  #savedList button { padding: 0 6px; color: #8b93a1; background: transparent; border-color: transparent; }
  #savedList button:hover { color: #ff8b8b; border-color: #333944; }
  #savedEmpty { padding: 10px 12px; color: #8b93a1; }
  #savedFoot { display: flex; gap: 6px; padding: 6px; border-top: 1px solid #2c313a; }
  #savedFoot button { padding: 2px 8px; }

  /* The reading list: the same panel, two groups. */
  #readingPanel { position: fixed; z-index: 30; min-width: 300px; max-width: 480px; max-height: 60vh;
                  display: flex; flex-direction: column; background: #1b1e24; color: #e8e8ea;
                  border: 1px solid #333944; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #readingPanel[hidden] { display: none; }
  #readingGroups { overflow-y: auto; padding: 4px 0; }
  #readingGroups h4 { margin: 6px 12px 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
                      color: #8b93a1; font-weight: 600; }
  #readingGroups h4 i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #readingGroups ul { margin: 0; padding: 0; list-style: none; }
  #readingGroups li { display: flex; align-items: center; gap: 4px; padding: 0 6px; }
  #readingGroups li:hover { background: #23272f; }
  #readingGroups a { flex: 1; min-width: 0; padding: 4px 4px; color: #e8e8ea; text-decoration: none;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #readingGroups button { padding: 0 6px; color: #8b93a1; background: transparent; border-color: transparent; }
  #readingGroups button:hover { color: #e8e8ea; border-color: #333944; }
  #readingGroups button.x:hover { color: #ff8b8b; }
  #readingEmpty { padding: 10px 12px; color: #8b93a1; }
  #readingFoot { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px; border-top: 1px solid #2c313a; }
  #readingFoot button { padding: 2px 8px; }
  #readerMark[aria-pressed="true"] { color: #ffd166; }
  #readerMark.read[aria-pressed="true"] { color: #b6f09c; }

  #trail { display: flex; gap: 6px; align-items: center; padding: 4px 12px;
           background: #181b20; border-bottom: 1px solid #2c313a; color: #8b93a1;
           font-size: 12px; overflow: hidden; white-space: nowrap; }
  #trail[hidden] { display: none; }
  #trailItems { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #trailItems a { color: #c4c9d2; text-decoration: none; padding: 1px 4px; border-radius: 3px; }
  #trailItems a:hover { background: #23272f; color: #e8e8ea; }
  #trailItems a.here { color: #9fd0ff; font-weight: 600; }
  #trailItems .sep { margin: 0 2px; color: #4a5160; }
  #trailClear { padding: 0 6px; font: inherit; color: #8b93a1; background: transparent;
                border: 1px solid transparent; }
  #trailClear:hover { border-color: #333944; color: #e8e8ea; }
  /* Drawn around a disambiguation page: the choices it stands for. */
  #dab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 12px;
         background: #2a2418; border-bottom: 1px solid #4a3f24; font-size: 12px; }
  #dab[hidden] { display: none; }
  #dabText { color: #e8e8ea; }
  #dabText b { color: #ffd166; }
  #dabChoices { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  #dabChoices button { padding: 2px 8px; }
  #dabChoices button small { color: #8b93a1; margin-left: 4px; }
  #dabClose { margin-left: auto; padding: 0 6px; font: inherit; color: #8b93a1; background: transparent;
              border: 1px solid transparent; }
  #dabClose:hover { border-color: #333944; color: #e8e8ea; }
  /* The reading order: the basics, then what the article builds on, then the article. */
  #order { display: flex; gap: 6px; align-items: flex-start; padding: 6px 12px;
           background: #181b20; border-bottom: 1px solid #2c313a; font-size: 12px; max-height: 38vh; overflow: auto; }
  #order[hidden] { display: none; }
  #orderBody { flex: 1; min-width: 0; color: #c4c9d2; }
  #orderBody h4 { margin: 4px 0 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: #8b93a1; }
  #orderBody h4 span { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
  #orderBody ol { margin: 0 0 4px; padding-left: 22px; columns: 2; column-gap: 24px; }
  @media (min-width: 1400px) { #orderBody ol { columns: 3; } }
  #orderBody li { break-inside: avoid; padding: 1px 0; }
  #orderBody li a { color: #e8e8ea; text-decoration: none; }
  #orderBody li a:hover { color: #9fd0ff; }
  #orderBody li .read { color: #b6f09c; margin-right: 4px; }
  #orderBody li small { color: #8b93a1; margin-left: 6px; }
  #orderBody li button { padding: 0 4px; margin-left: 4px; font-size: 11px; color: #8b93a1;
                         background: transparent; border-color: transparent; }
  #orderBody li button:hover { color: #e8e8ea; border-color: #333944; }
  #orderBody .note { color: #8b93a1; font-style: italic; }
  #orderClose { padding: 0 6px; font: inherit; color: #8b93a1; background: transparent;
                border: 1px solid transparent; }
  #orderClose:hover { border-color: #333944; color: #e8e8ea; }
  /* The path explained: one sentence per hop, under the trail. */
  #pathWhy { display: flex; gap: 6px; align-items: flex-start; padding: 6px 12px;
             background: #181b20; border-bottom: 1px solid #2c313a; font-size: 12px; }
  #pathWhy[hidden] { display: none; }
  #pathWhyItems { flex: 1; min-width: 0; margin: 0; padding: 0 0 0 18px; color: #c4c9d2; }
  #pathWhyItems li { margin: 1px 0; }
  #pathWhyItems .hop { color: #9fd0ff; font-weight: 600; }
  #pathWhyItems b { color: #e8e8ea; }
  #pathWhyItems i { color: #8b93a1; }
  #pathWhyItems .none { color: #8b93a1; font-style: italic; }
  #pathWhyClose { padding: 0 6px; font: inherit; color: #8b93a1; background: transparent;
                  border: 1px solid transparent; }
  #pathWhyClose:hover { border-color: #333944; color: #e8e8ea; }
  #game { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
          padding: 6px 12px; background: #1f2a1c; border-bottom: 1px solid #2f4a2a; }
  /* An author `display` beats the browser's own [hidden] rule, so the attribute alone
     left the bar on screen from the first load. Say it explicitly. */
  #game[hidden] { display: none; }
  #game b { color: #b6f09c; }
  #gameTrail { color: #8b93a1; }
  #gameResult { color: #e8e8ea; }
  #game button { padding: 2px 8px; }
  #gameClose { margin-left: auto; }
  #main { flex: 1; min-height: 0; display: flex; position: relative; }
  #mount { flex: 1; min-width: 0; position: relative; }
  #mount > .vault-graph { height: 100%; }

  /* The table: over the disc, which keeps its size underneath so nothing re-fits. */
  /* Above the disc's own card and tool buttons (z 6-8 inside the mount), below the
     reader when that floats over the disc on a narrow screen (z 10). */
  #table { position: absolute; inset: 0; z-index: 9; display: flex; flex-direction: column;
           background: #14161a; }
  #table[hidden] { display: none; }
  #tableBar { display: flex; gap: 8px; align-items: center; padding: 6px 12px;
              background: #1b1e24; border-bottom: 1px solid #2c313a; }
  #tableFilter { width: 200px; }
  #tableCount { color: #8b93a1; flex: 1; }
  #tableScroll { flex: 1; overflow: auto; }
  #table table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  #table th, #table td { padding: 4px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid #22262d; }
  #table th { position: sticky; top: 0; background: #1b1e24; color: #8b93a1; font-weight: 600;
              cursor: pointer; user-select: none; }
  #table th:hover { color: #e8e8ea; }
  #table th.on { color: #9fd0ff; }
  #table th.on::after { content: " ▾"; }
  #table th.on.asc::after { content: " ▴"; }
  #table td.num, #table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  #table tbody tr { cursor: pointer; }
  #table tbody tr:hover { background: #1b1e24; }
  #table tbody tr.sel { background: #23272f; }
  #table td.title { max-width: 360px; overflow: hidden; text-overflow: ellipsis; color: #e8e8ea; }
  #table td .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #table td .mark { font-size: 11px; }
  #table td .mark.toread { color: #ffd166; }
  #table td .mark.read { color: #b6f09c; }

  /* The article beside the disc. Width is the reader's, in a CSS variable the divider
     drags; the disc takes the rest and re-fits itself (upstream watches its own box). */
  #reader { width: var(--reader-w, 44%); min-width: 320px; max-width: 75%; z-index: 10;
            display: flex; flex-direction: column; background: #14161a; border-left: 1px solid #2c313a; }
  #reader[hidden], #divider[hidden] { display: none; }
  #divider { width: 6px; cursor: col-resize; background: #1b1e24; flex: none; }
  #divider:hover, #divider.dragging { background: #3987e5; }
  #readerBar { display: flex; gap: 8px; align-items: center; padding: 6px 10px;
               background: #1b1e24; border-bottom: 1px solid #2c313a; color: #e8e8ea; }
  #readerTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; font-weight: 600; }
  #readerOnDisc { color: #ffd166; font-size: 12px; white-space: nowrap; }
  #readerBar button, #readerBar a { padding: 2px 8px; font: inherit; color: #e8e8ea;
                                    background: #23272f; border: 1px solid #333944;
                                    border-radius: 5px; text-decoration: none; cursor: pointer; }
  /* The article arrives styled white by mwoffliner's Vector skin; a dark stylesheet is
     injected on load (same origin). Until then the frame is transparent, so the page
     never flashes white between the load and the injection. */
  #readerFrame { flex: 1; border: 0; width: 100%; background: #14161a; opacity: 0;
                 transition: opacity .15s; color-scheme: dark; }
  #readerFrame.themed { opacity: 1; }
  /* Too narrow for two columns: the reader floats over the disc instead of crushing it. */
  @media (max-width: 900px) {
    #reader { position: absolute; right: 0; top: 0; bottom: 0; width: 88%; max-width: none;
              box-shadow: -8px 0 24px rgba(0,0,0,.5); }
    #divider { display: none !important; }
  }
</style>
</head>
<body>

<div id="bar">
  <strong>Wikigraph</strong>

  <label for="view">View</label>
  <select id="view">
    <option value="neighborhood" selected>Around an article</option>
    <option value="in">What links here</option>
    <option value="out">What it links to</option>
    <option value="path">Path between two</option>
    <option value="common">Common ground of two</option>
    <option value="similar">Similar to</option>
    <option value="category">Category tree</option>
    <option value="top">Most linked-to</option>
    <option value="text" id="viewText">Articles that mention</option>
    <option value="order" id="viewOrder">Reading order for</option>
  </select>

  <input type="text" id="q" list="hits" placeholder="Physics" value="Physics">
  <label for="q2" id="q2Label" hidden>→</label>
  <input type="text" id="q2" list="hits" placeholder="Napoleon" value="Napoleon" hidden>
  <datalist id="hits"></datalist>

  <label for="limit">Nodes</label>
  <select id="limit">
    <option>1000</option><option selected>2500</option>
    <option>4000</option><option>6000</option>
  </select>

  <label for="hops" id="hopsLabel">Hops</label>
  <select id="hops"><option>1</option><option selected>2</option><option>3</option></select>

  <button id="go">Draw</button>
  <button id="random" title="A random well-linked article as the centre, respecting the filters. With 'Draw around this' on the card, an aimless walk.">&#127922; Surprise me</button>
  <button id="play" title="Six degrees: two random articles; get from one to the other by clicking 'Draw around this', then see how your route compares with the shortest.">&#127919; Six degrees</button>
  <button id="star" title="Save this view in this browser" aria-label="Save this view">&#9734;</button>
  <button id="savedBtn" title="Saved views">Saved</button>
  <button id="readingBtn" title="Your reading list: articles marked to read or read">Reading</button>
  <button id="tableBtn" title="The disc's articles as a sortable table" aria-pressed="false">Table</button>
  <select id="reading" title="Reading state as a filter on every view. Marked articles wear a halo: gold to read, green read.">
    <option value="all" selected>all articles</option>
    <option value="unread">hide read</option>
    <option value="marked">only marked</option>
    <option value="toread">only to read</option>
  </select>

  <label for="group" title="Topic: how the wiki files these articles. Cluster: how they actually hang together, by modularity on the links drawn — each wedge named after its three most linked-to members. Hop distance: the shells of the neighbourhood — the seed, what it links to, what those link to.">Wedges</label>
  <select id="group">
    <option value="topic" selected>by topic</option>
    <option value="cluster">by cluster</option>
    <option value="hops" id="groupHops">by hop distance</option>
  </select>

  <label for="size" id="sizeLabel" title="What a dot's size shows. Links drawn: its degree on this disc (the default, and what also places it). In-degree: how many articles in the whole wiki link to it. PageRank: the same, weighed by who does the linking. Length: the article's size in bytes. Log-scaled, so hubs stand out without everything else vanishing.">Dots</label>
  <select id="size">
    <option value="degree" selected>by links drawn</option>
    <option value="indegree">by in-degree</option>
    <option value="pagerank" id="sizePagerank">by PageRank</option>
    <option value="length">by length</option>
  </select>

  <label for="rank" id="rankLabel" title="What 'important' means when a view chooses which articles to show. In-degree counts links; PageRank weighs each by where it comes from, so a mention in a navbox on a thousand stubs counts for less than one from a major article.">Rank</label>
  <select id="rank">
    <option value="indegree" selected>by in-degree</option>
    <option value="pagerank">by PageRank</option>
  </select>

  <span id="hide" title="Kinds of page to leave out of every view">
    <label>Hide</label>
    <label><input type="checkbox" value="list" checked> lists</label>
    <label><input type="checkbox" value="date" checked> dates</label>
    <label><input type="checkbox" value="dab" checked> disambiguation</label>
    <label><input type="checkbox" value="infra" checked> infobox links</label>
    <label for="minlen" title="Skip articles shorter than this. Length is bytes of wikitext; 1 KB is roughly 150 words.">shorter than</label>
    <select id="minlen">
      <option value="0">any length</option>
      <option value="500">500 B</option>
      <option value="1000" selected>1 KB</option>
      <option value="2000">2 KB</option>
      <option value="5000">5 KB</option>
      <option value="10000">10 KB</option>
    </select>
  </span>

  <label id="mutualLabel" title="Draw and follow only links that go both ways. A one-way link is a mention; a mutual one means the two articles are about each other.">
    <input type="checkbox" id="mutual"> mutual links only
  </label>

  <label id="sinceLabel" hidden title="Links that did not exist in the previous month's build are drawn in gold. Needs two builds on disk (the monthly refresh keeps them).">
    <input type="checkbox" id="since"> new links
  </label>

  <label for="within" id="withinLabel" title="Only articles filed under this category or its subcategories, three levels down. Seeds and path endpoints are always allowed.">within</label>
  <input type="text" id="within" list="cathits" placeholder="any category">
  <datalist id="cathits"></datalist>

  <span id="status">loading…</span>
</div>

<div id="savedPanel" hidden>
  <ul id="savedList"></ul>
  <div id="savedEmpty" hidden>Nothing saved yet. &#9734; keeps the view on screen.</div>
  <div id="savedFoot">
    <button id="savedExport" title="Download the list as JSON">Export</button>
    <button id="savedImport" title="Add views from an exported JSON file">Import</button>
    <input type="file" id="savedFile" accept="application/json,.json" hidden>
  </div>
</div>

<div id="readingPanel" hidden>
  <div id="readingGroups"></div>
  <div id="readingEmpty" hidden>Nothing marked yet. The card and the reader have <i>to read</i> and <i>read</i>.</div>
  <div id="readingFoot">
    <button id="readingCopy" title="The reading list as Markdown, on the clipboard">Copy list as Markdown</button>
    <button id="viewCopy" title="The articles on the disc as a Markdown list, on the clipboard">Copy view as Markdown</button>
  </div>
</div>

<div id="trail" hidden>
  <span id="trailItems"></span>
  <button id="trailClear" title="Forget this walk">&times;</button>
</div>

<div id="dab" hidden>
  <span id="dabText"></span>
  <span id="dabChoices"></span>
  <button id="dabClose" title="Keep this disc" aria-label="Keep this disc">&times;</button>
</div>

<div id="order" hidden>
  <div id="orderBody"></div>
  <button id="orderClose" title="Hide the reading order" aria-label="Hide the reading order">&times;</button>
</div>

<div id="pathWhy" hidden>
  <ol id="pathWhyItems"></ol>
  <button id="pathWhyClose" title="Hide the explanation" aria-label="Hide the explanation">&times;</button>
</div>

<div id="game" hidden>
  <span id="gameGoal"></span>
  <span id="gameTrail"></span>
  <span id="gameResult"></span>
  <button id="gameShortest" hidden>Show the shortest path</button>
  <button id="gameAgain" hidden>Play again</button>
  <button id="gameQuit">Give up</button>
  <button id="gameClose" title="Close the game" aria-label="Close the game">&times;</button>
</div>

<div id="main">
  <div id="mount"></div>
  <div id="table" hidden>
    <div id="tableBar">
      <input type="text" id="tableFilter" placeholder="filter rows">
      <span id="tableCount"></span>
      <button id="tableCopy" title="These rows as Markdown, on the clipboard">Copy as Markdown</button>
      <button id="tableClose" title="Back to the disc">&times;</button>
    </div>
    <div id="tableScroll"><table><thead><tr></tr></thead><tbody></tbody></table></div>
  </div>
  <div id="divider" hidden title="Drag to resize"></div>
  <aside id="reader" hidden>
    <div id="readerBar">
      <button id="readerBack" title="Back, within the article panel">&#8592;</button>
      <span id="readerTitle"></span>
      <span id="readerOnDisc" title="Links in this article to articles on the disc are underlined in gold; the mouse over one lights its dot, a click selects it"></span>
      <button id="readerMark" title="Mark the article being read: to read, then read, then unmarked">&#9734; to read</button>
      <button id="readerRecenter" title="Redraw the disc around the article being read">&#8982; Draw around this</button>
      <a id="readerExternal" target="_blank" rel="noopener" title="Open in a new tab">&#8599;</a>
      <button id="readerClose" title="Close the article panel">&times;</button>
    </div>
    <iframe id="readerFrame" title="Article"></iframe>
  </aside>
</div>

<script src="vendor/engine.js"></script>
<script type="module">
import { mountVaultGraph } from "./vendor/page.js";

const $ = (id) => document.getElementById(id);
const status = (msg, err = false) => {
  $("status").textContent = msg;
  $("status").classList.toggle("err", err);
};

let info = {};
try {
  info = await (await fetch("api/info")).json();
} catch {
  status("API unreachable", true);
}

// The markup lives in vendor/page.html; pulling it in at runtime keeps this shell free
// of a build step.
const markup = await (await fetch("vendor/page.html")).text();

/**
 * The controls are the state, and the URL hash mirrors them -- so any view can be
 * bookmarked, sent to someone, or stepped back through with the browser's own back
 * button. The hash rather than the query string: it never reaches the server, so a
 * shared link is just a link and the API stays cacheable by path.
 */
const FIELDS = ["view", "q", "q2", "limit", "hops", "minlen", "within", "group", "rank", "size", "reading"];
const hideBoxes = () => [...document.querySelectorAll("#hide input")];
const hideValue = () => hideBoxes().filter((b) => b.checked).map((b) => b.value).join(",");

function readHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (![...h.keys()].length) return false;
  for (const f of FIELDS) {
    if (!h.has(f)) continue;
    const el = $(f), v = h.get(f);
    el.value = v;
    // A shared link may carry a value the dropdown does not list (limit=600, say).
    // Setting it leaves the select blank and the request without the value, so the
    // option is added rather than the URL's intent dropped.
    if (el.tagName === "SELECT" && el.value !== v && /^\d+$/.test(v)) {
      const opt = new Option(v, v, true, true);
      el.append(opt);
      el.value = v;
    }
  }
  if (h.has("hide")) {
    const on = new Set(h.get("hide").split(","));
    for (const b of hideBoxes()) b.checked = on.has(b.value);
  }
  $("mutual").checked = h.get("mutual") === "1";
  $("since").checked = h.get("since") === "1";
  if (!h.has("group")) $("group").value = "topic";
  if (!h.has("rank")) $("rank").value = "indegree";
  if (!h.has("size")) $("size").value = "degree";
  if (!h.has("reading")) $("reading").value = "all";
  return true;
}

function writeHash(push) {
  const h = new URLSearchParams();
  const view = $("view").value;
  for (const f of FIELDS) {
    // Only what the view actually uses, so the link says what it shows.
    if (f === "q2" && !["path", "common"].includes(view)) continue;
    if (f === "hops" && !["neighborhood", "in", "out"].includes(view)) continue;
    if (f === "q" && view === "top") continue;
    if (f === "group" && $(f).value === "topic") continue;
    if (f === "rank" && $(f).value === "indegree") continue;
    if (f === "size" && $(f).value === "degree") continue;
    if (f === "reading" && $(f).value === "all") continue;
    // The category view is already a category; "within" would only repeat it.
    if (f === "within" && (view === "category" || !$(f).value.trim())) continue;
    h.set(f, $(f).value.trim());
  }
  h.set("hide", hideValue());
  if ($("mutual").checked) h.set("mutual", "1");
  if ($("since").checked) h.set("since", "1");
  const next = "#" + h.toString();
  if (next === location.hash) return;
  if (push) history.pushState(null, "", next); else history.replaceState(null, "", next);
}

// The disc on screen: what mountVaultGraph returned (its `api` addresses dots by
// title once the scene is built) and the titles it holds, for the reader to mark.
const disc = { mounted: null, labels: new Set(), api() { return this.mounted?.api ?? null; } };

async function draw({ push = true, fromGame = false } = {}) {
  // The game bar belongs to a game in progress. A draw the game did not ask for --
  // the Draw button, a changed view or filter, Surprise me, the back button -- means
  // the player has moved on, so the game ends and its bar goes with it.
  if (game && !fromGame) endGame();

  const view = $("view").value;
  const q = $("q").value.trim();
  const limit = $("limit").value;
  writeHash(push);

  const t = encodeURIComponent(q);
  const w = $("within").value.trim();
  const hide = `&hide=${hideValue()}&minlen=${$("minlen").value}&group=${$("group").value}&rank=${$("rank").value}&size=${$("size").value}` +
               ($("mutual").checked ? "&mutual=1" : "") + ($("since").checked ? "&since=1" : "") +
               (w && view !== "category" ? `&within=${encodeURIComponent(w)}` : "");
  const url = (
    view === "top" ? `api/view/top?limit=${limit}`
    : view === "category" ? `api/view/category?title=${t}&limit=${limit}&depth=3`
    : view === "path" ? `api/view/path?from=${t}&to=${encodeURIComponent($("q2").value.trim())}&limit=${limit}`
    : view === "common" ? `api/view/common?from=${t}&to=${encodeURIComponent($("q2").value.trim())}&limit=${limit}`
    : view === "similar" ? `api/view/similar?title=${t}&limit=${limit}`
    : `api/view/neighborhood?title=${t}&limit=${limit}&hops=${$("hops").value}` +
      `&direction=${view === "neighborhood" ? "both" : view}`) + hide;

  status("querying…");
  const t0 = performance.now();
  let data;
  try {
    let res;
    if (view === "text") {
      // Kiwix's index answers "which articles mention this"; the graph answers how
      // they hang together. Hits in Kiwix's order, then the set drawn as a disc.
      const hits = await textHits(q, Number(limit));
      if (!hits.titles.length) throw new Error(`no article mentions "${q}"`);
      res = await fetch(`api/view/set?limit=${limit}${hide}`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ titles: hits.titles, title: `Articles that mention "${q}"` }),
      });
      data = await res.json();
      if (res.ok) data.textHits = hits.total;
    } else if (view === "order") {
      // What the article assumes, from lead paragraphs; then the set as a disc, in
      // reading order, and the order itself as a numbered strip.
      const order = await readingOrder(q);
      res = await fetch(`api/view/set?limit=${limit}${hide}`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ titles: order.titles, title: `Reading order for ${order.title}`, role: "step", pin: order.title }),
      });
      data = await res.json();
      if (res.ok) data.order = order;
    } else {
      res = await fetch(url);
      data = await res.json();
    }
    if (!res.ok) throw new Error(data.error ?? res.statusText);
  } catch (e) {
    status(e.message, true);
    return;
  }
  const queried = Math.round(performance.now() - t0);

  // mountVaultGraph builds its whole scene from the element it is given, so a fresh
  // one per view is the honest way to swap datasets -- reusing the node would leave
  // the previous disc's locks (band, geometry, normalisation box) in place, and those
  // are deliberately derived once at load.
  $("mount").innerHTML = markup;

  // The reading state is the browser's, not the server's: it goes onto the nodes here
  // (a halo, and a tag on the card), and the reading filter is applied here too.
  data = reading.apply(data, $("reading").value);

  const t1 = performance.now();
  disc.mounted = mountVaultGraph($("mount").querySelector("#vg-app"), data, {
    Graph: window.VaultGraphEngine.GraphStore,
    Renderer: window.VaultGraphEngine.Renderer,
    settingsUI: false,
    // The detail card's "read" button. No `/A/` namespace: ZIMs built since 2021 put
    // articles at /content/<book>/<Title> directly. Returning nothing (no ZIM
    // configured) makes the page omit the button rather than draw a dead one.
    articleHref: (label) =>
      info.reader ? `${info.reader}/${encodeURIComponent(label.replace(/ /g, "_"))}` : "",
    // A plain click on that button opens the article beside the disc; the href still
    // works for middle-click and the ↗ in the panel, so a new tab remains one gesture away.
    onOpen: (label, href) => reader.show(href, label),
    // What the view is about sits in the hub -- upstream's own "pin to hub" feature:
    // the seed of a neighbourhood, the chain of a path, both seeds of common ground.
    pinned: data.pinned ?? [],
    // "Draw around this" on the card: a new neighbourhood with that article as the
    // seed. This is what turns a picture into a walk -- each click is a page in the
    // history, so the back button retraces it.
    onRecenter: (label) => {
      $("view").value = "neighborhood";
      $("q").value = label;
      syncControls();
      const playing = !!game && !game.done;
      gameStep(label);
      draw({ fromGame: playing || (!!game && game.done) });
    },
    // The first paragraph, from Kiwix, in the card. Only offered when a reader is
    // configured; without one the card simply has no preview block.
    articlePreview: info.reader ? articlePreview : undefined,
    // Rank and categories under it, from the API; the chips draw or filter.
    articleFacts,
    // To read / read on the card.
    articleActions: (label, el) => reading.buttons(label, el),
    // Whether selecting an article flies the camera to it. The disc is rebuilt on every
    // draw, so the choice lives here, in the browser, and is handed back each time.
    followZoom: localStorage.getItem("wikigraph.follow") !== "0",
    onFollowZoom: (v) => { try { localStorage.setItem("wikigraph.follow", v ? "1" : "0"); } catch {} },
    // "why?" beside a neighbour: the sentence that makes the link, from Kiwix.
    linkWhy: info.reader ? (from, to, el) => {
      el.textContent = "…";
      linkSnippet(from, to).then((sn) => { if (el.isConnected) el.replaceChildren(snippetNode(sn, from, to)); });
    } : undefined,
    // A neighbour clicked on the card: if the article on the card is the one being
    // read, scroll the reader to the link that made them neighbours.
    onNeighbour: (from, to) => reader.scrollToLink(from, to),
  });
  disc.labels = new Set(data.nodes.map((n) => n.label));
  disc.data = data;
  table.refresh();
  reader.markLinks();
  const drawn = Math.round(performance.now() - t1);
  // The legend heading is static markup; say what the wedges are this time.
  const heading = $("mount").querySelector("#vg-legend")?.previousElementSibling?.querySelector(".lbl")
    ?? [...$("mount").querySelectorAll(".lbl")].find((el) => /^(Topics|Clusters|Hops|Subcategories)/.test(el.textContent));
  if (heading) {
    const g = $("group").value;
    const word = g === "cluster" ? "Clusters" : g === "hops" && nbhdView(view) ? "Hops"
               : view === "category" ? "Subcategories" : "Topics";
    heading.childNodes[0].textContent = word + " ";
  }

  // During a game the disc's own search is pointed at the target, so it lights up
  // the moment it is within reach -- seeing it is fair; finding the way there is the game.
  if (game && !game.done) {
    const vq = $("mount").querySelector("#vg-q");
    if (vq) { vq.value = game.to; vq.dispatchEvent(new Event("input", { bubbles: true })); }
  }

  // The seed's canonical title (it is the pinned node), not what was typed.
  trailRecord(view, data.pinned?.length ? data.nodes[Number(data.pinned[0])].label : q);
  pathWhy(data.pathTitles);
  orderStrip(data.order, data);
  dabStrip(data.dab);
  saved.drawn(data.vault);

  status((data.similar ? `${data.similar.candidates.toLocaleString()} articles share links with it · ` : "") +
         (data.since ? `${data.since.newEdges.toLocaleString()} links new since ${data.since.build} · ` : "") +
         (data.readingHidden ? `${data.readingHidden} hidden by reading state · ` : "") +
         (data.textHits !== undefined ? `${data.textHits.toLocaleString()} articles mention it · ` +
           (data.set.filtered ? `${data.set.filtered} filtered · ` : "") : "") +
         (data.within ? `${data.within.articles.toLocaleString()} articles under ${data.within.name} · ` : "") +
         (data.pathTitles ? data.pathTitles.join(" → ") + " · " : "") +
         (data.common ? `both link to ${data.common.cited}, ${data.common.citing} link to both · ` : "") +
         `${data.nodes.length.toLocaleString()} articles · ` +
         `${data.edges.length.toLocaleString()} links · ${queried}ms query · ${drawn}ms draw`);
}

/**
 * The reader: the article beside the disc, in an iframe on the same origin (Kiwix is
 * behind the same hostname), so the frame is ours to read -- its current URL gives
 * the title, and links inside it are plain relative hrefs that navigate the frame on
 * their own. The panel follows what you open; it is not part of the URL, since the
 * view is the URL and the article is what you happen to be reading.
 */
const reader = {
  el: $("reader"), frame: $("readerFrame"), open: false,
  // Its own back-stack. An iframe shares the joint session history with the window,
  // so a link click in the article and a recenter of the disc land in one list, and
  // "back" in the panel would undo whichever came last -- the disc, as it turned out.
  // Every navigation in the frame goes through location.replace(), which adds no
  // history entry, and the panel remembers where it has been itself. Browser back
  // is then the disc's history only; the panel's ← is the panel's only.
  stack: [],
  go(url) {
    this.frame.classList.remove("themed");   // the next document arrives white too
    const win = this.frame.contentWindow;
    if (win && win.location.href !== "about:blank") win.location.replace(url);
    else this.frame.src = url;
  },
  titleOf(url) {
    // /kiwix/content/<book>/<Title> -> Title, underscores to spaces.
    try { return decodeURIComponent(new URL(url).pathname.split("/").pop()).replace(/_/g, " "); }
    catch { return ""; }
  },
  show(href, label) {
    if (!info.reader) return;
    this.open = true;
    this.el.hidden = $("divider").hidden = false;
    $("readerTitle").textContent = label;
    $("readerExternal").href = href;
    const cur = this.frame.contentWindow?.location?.href;
    if (cur && cur !== "about:blank" && cur !== href) this.stack.push(cur);
    if (cur !== href) this.go(href);
  },
  back() {
    const prev = this.stack.pop();
    if (prev) this.go(prev);
  },
  close() {
    this.open = false;
    this.el.hidden = $("divider").hidden = true;
  },
  current() { return this.titleOf(this.frame.contentWindow?.location?.href ?? this.frame.src); },

  /**
   * The article and the disc, aware of each other. Every link in the article whose
   * target is a dot on the disc is marked; the mouse over it lights the dot, a click
   * selects it (and follows the link as usual -- reading is not interrupted, the disc
   * simply keeps up). Re-run after every draw, since the disc changes under the
   * article: the marks are the intersection of the two, not a property of either.
   */
  markLinks() {
    let doc;
    try { doc = this.open ? this.frame.contentDocument : null; } catch { doc = null; }
    if (!doc?.body) return;
    const here = this.frame.contentWindow.location.href;
    const on = new Set();
    for (const a of doc.querySelectorAll("a[href]")) {
      a.classList.remove("wg-on-disc");
      if (a.dataset.wgTitle === undefined) {
        // Resolved once per link: the title a same-origin article link points at.
        let t = "";
        try {
          const u = new URL(a.getAttribute("href"), here);
          if (u.origin === location.origin && !u.hash) t = this.titleOf(u.href);
        } catch {}
        a.dataset.wgTitle = t;
        if (t) {
          a.addEventListener("mouseenter", () => { if (a.classList.contains("wg-on-disc")) disc.api()?.hover(t); });
          a.addEventListener("mouseleave", () => { if (a.classList.contains("wg-on-disc")) disc.api()?.hover(null); });
          a.addEventListener("click", (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
            if (a.classList.contains("wg-on-disc")) disc.api()?.select(t);
          });
        }
      }
      if (a.dataset.wgTitle && disc.labels.has(a.dataset.wgTitle)) { a.classList.add("wg-on-disc"); on.add(a.dataset.wgTitle); }
    }
    $("readerOnDisc").textContent = on.size ? `${on.size} on the disc` : "";
  },
  // The card's neighbour list, the other way round: the article being read is `from`,
  // so the first link in it to `to` is where the two meet. Scroll there and flash it.
  scrollToLink(from, to) {
    if (!this.open || this.current() !== from) return;
    let doc;
    try { doc = this.frame.contentDocument; } catch { return; }
    const a = [...doc.querySelectorAll("a[href]")].find((x) => x.dataset.wgTitle === to);
    if (!a) return;
    a.scrollIntoView({ block: "center", behavior: "smooth" });
    a.classList.add("wg-flash");
    setTimeout(() => a.classList.remove("wg-flash"), 1600);
  },
};

/**
 * The article in the page's own colours. mwoffliner ships the Vector skin, white on
 * white; this overrides its surfaces and text with the palette the rest of Wikigraph
 * uses, targeting the skin's classes rather than fighting its selectors one by one.
 * Images are left alone.
 */
const READER_THEME = `
  :root { color-scheme: dark; }
  html, body, .mw-page-container, .mw-page-container-inner, .mw-body, .mw-body-content,
  .vector-body, .mw-parser-output, .mw-content-container {
    background: #14161a !important; color: #e8e8ea !important;
  }
  body { font-size: 15px; line-height: 1.55; }
  .mw-body { padding: 8px 18px 40px; margin: 0; border: 0; }
  h1, h2, h3, h4, h5, .mw-headline, #firstHeading, .firstHeading {
    color: #f2f2f4 !important; border-color: #2c313a !important;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a, a:visited { color: #9fd0ff !important; }
  a:hover { color: #c9e4ff !important; }
  a.new, a.new:visited { color: #ff8b8b !important; }
  a.external { color: #7fc8a9 !important; }
  /* A link whose target is a dot on the disc: same colour, underlined in the hub's
     gold, so the eye finds it without the text changing. */
  a.wg-on-disc { text-decoration: underline !important; text-decoration-color: #ffd166 !important;
                 text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  a.wg-on-disc:hover { background: rgba(255, 209, 102, .14); border-radius: 2px; }
  a.wg-flash { background: rgba(255, 209, 102, .35) !important; border-radius: 2px;
               transition: background .6s; }
  .infobox, table.wikitable, .navbox, .toccolours, .sidebar, .box-Multiple_issues, .ambox,
  .mbox, .tmbox, table.metadata, .mw-collapsible, .catlinks, .mw-references-wrap, .refbegin {
    background: #1b1e24 !important; color: #e8e8ea !important; border-color: #2c313a !important;
  }
  .infobox th, table.wikitable th, .navbox th, .infobox-header, .infobox-above, .sidebar-title,
  .infobox caption, .navbox-title, .navbox-group {
    background: #23272f !important; color: #e8e8ea !important;
  }
  .infobox td, .infobox th, table.wikitable td, table.wikitable th { border-color: #2c313a !important; }
  .infobox-subheader, .infobox-below, .infobox-data, .infobox-label { color: #e8e8ea !important; }
  tr, td, th { background-color: transparent !important; }
  .infobox [style*="background"], .navbox [style*="background"] { background: #23272f !important; }
  figure, .thumb, .thumbinner, .thumbcaption, figcaption, .gallerybox, .gallerytext {
    background: #1b1e24 !important; color: #8b93a1 !important; border-color: #2c313a !important;
  }
  .hatnote, .dablink, .rellink, .mw-editsection, .noprint, .mw-empty-elt, .reference-text {
    color: #8b93a1 !important;
  }
  .hatnote, .dablink { background: transparent !important; border-color: #2c313a !important; }
  hr { border-color: #2c313a; }
  code, pre, tt, .mw-highlight { background: #23272f !important; color: #e8e8ea !important;
                                  border-color: #2c313a !important; }
  blockquote { border-left: 3px solid #2c313a; color: #c4c9d2; }
  sup.reference a { color: #9fd0ff !important; }
  .zim-footer, #footer, .printfooter { color: #8b93a1 !important; border-color: #2c313a !important;
                                       background: transparent !important; }
  img.mw-file-element, .infobox img, .thumbimage { border-radius: 3px; }
  /* Formulae are black-on-transparent SVGs; MediaWiki marks them .mw-invert for exactly
     this case, and so are a few icons that would otherwise vanish on a dark ground. */
  .mw-invert, .skin-invert, .mwe-math-fallback-image-inline, .mwe-math-fallback-image-display {
    filter: invert(1) hue-rotate(180deg);
  }
  ::selection { background: #3987e5; color: #fff; }
`;

function themeFrame() {
  try {
    const doc = reader.frame.contentDocument;
    if (!doc?.head) return;
    if (!doc.getElementById("wg-theme")) {
      const style = doc.createElement("style");
      style.id = "wg-theme";
      style.textContent = READER_THEME;
      doc.head.appendChild(style);
    }
  } catch {}
  reader.frame.classList.add("themed");
}

// Every navigation inside the frame -- a link click, back -- lands here.
reader.frame.addEventListener("load", () => {
  themeFrame();
  const url = reader.frame.contentWindow?.location?.href;
  if (!url) return;
  const title = reader.titleOf(url);
  if (title) $("readerTitle").textContent = title;
  $("readerExternal").href = url;
  reader.markLinks();
  reading.syncReaderButton();
  // Links off the wiki (mwoffliner keeps a "view on wikipedia.org" link, and citations)
  // leave the panel for a tab rather than steering the frame onto the internet.
  try {
    reader.frame.contentDocument.addEventListener("click", (ev) => {
      const a = ev.target.closest?.("a[href]");
      if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
      const target = new URL(a.getAttribute("href"), url);
      if (target.origin !== location.origin) {
        ev.preventDefault(); window.open(target.href, "_blank", "noopener"); return;
      }
      if (target.hash && target.pathname === new URL(url).pathname) return;   // in-page anchor
      ev.preventDefault();
      reader.stack.push(url);
      reader.go(target.href);
    });
  } catch {}
  $("readerBack").disabled = reader.stack.length === 0;
});
$("readerClose").addEventListener("click", () => reader.close());
$("readerBack").addEventListener("click", () => reader.back());
$("readerRecenter").addEventListener("click", () => {
  const t = reader.current();
  if (!t) return;
  $("view").value = "neighborhood";
  $("q").value = t;
  syncControls();
  gameStep(t);
  draw({ fromGame: !!game });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && reader.open) reader.close(); });

// The divider: drag to set the reader's width, remembered per browser.
{
  const div = $("divider");
  let dragging = false;
  div.addEventListener("pointerdown", (e) => { dragging = true; div.classList.add("dragging"); div.setPointerCapture(e.pointerId); });
  div.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const w = Math.max(320, Math.min(window.innerWidth * 0.75, window.innerWidth - e.clientX));
    document.documentElement.style.setProperty("--reader-w", w + "px");
  });
  div.addEventListener("pointerup", () => {
    dragging = false; div.classList.remove("dragging");
    try { localStorage.setItem("wikigraph:reader-w", document.documentElement.style.getPropertyValue("--reader-w")); } catch {}
  });
  try {
    const w = localStorage.getItem("wikigraph:reader-w");
    if (w) document.documentElement.style.setProperty("--reader-w", w);
  } catch {}
}

/**
 * Fill the card's preview element with the article's first paragraph.
 *
 * Kiwix sits behind the same hostname as this page, so the fetch is same-origin: no
 * CORS, no proxy, nothing for the API to do. The HTML is mwoffliner's, which keeps
 * the article body under `#mw-content-text`; the intro is the first real paragraph
 * there -- past the hatnotes ("For other uses, see …"), past the infobox table, past
 * the empty `<p>` mwoffliner leaves around block elements.
 *
 * Cached per title for the session, and the previous fetch is aborted when the
 * selection moves on, so a fast walk through the linked-articles list does not queue
 * up a dozen requests whose answers arrive for cards that are already gone.
 */
const previewCache = new Map();
let previewAbort = null;

async function articlePreview(label, el) {
  if (previewAbort) previewAbort.abort();
  const ctl = new AbortController();
  previewAbort = ctl;

  const title = label.replace(/ /g, "_");
  if (previewCache.has(title)) return showPreview(el, previewCache.get(title));

  el.hidden = false;
  el.classList.add("pending");
  el.textContent = "loading…";

  let preview = null;
  try {
    const url = `${info.reader}/${encodeURIComponent(title)}`;
    const res = await fetch(url, { signal: ctl.signal });
    if (res.ok) {
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      const text = firstParagraph(doc);
      preview = text ? { text, image: leadImage(doc, url) } : null;
    }
  } catch (e) {
    if (e.name === "AbortError") return;   // superseded; the next card is drawing
  }
  previewCache.set(title, preview);
  if (!ctl.signal.aborted) showPreview(el, preview);
}

/**
 * The facts block: where the article stands in the whole wiki, and its categories.
 * The view data carries neither -- it is about the selection -- so the card asks per
 * article, cached. Each category is two actions: its name draws the category tree,
 * the ⊂ beside it keeps the current view and narrows it to that category.
 */
const factsCache = new Map();
async function articleFacts(label, el) {
  const title = label.replace(/ /g, "_");
  let f = factsCache.get(title);
  if (f === undefined) {
    try {
      const res = await fetch(`api/article?title=${encodeURIComponent(title)}`);
      f = res.ok ? await res.json() : null;
    } catch { f = null; }
    factsCache.set(title, f);
  }
  if (!f || !el.isConnected) return;
  el.replaceChildren();
  const line = document.createElement("div");
  line.className = "line";
  const of = f.of >= 1e6 ? `${(f.of / 1e6).toFixed(1)}M` : f.of.toLocaleString();
  const item = (html, tip) => { const s = document.createElement("span"); s.innerHTML = html; if (tip) s.title = tip; line.append(s); };
  item(`<b>#${f.rank.indegree.toLocaleString()}</b> of ${of}`,
       `By in-degree: ${f.indeg.toLocaleString()} articles link here` +
       (f.rank.pagerank ? `; #${f.rank.pagerank.toLocaleString()} by PageRank` : ""));
  if (f.rank.pagerank) item(`<b>#${f.rank.pagerank.toLocaleString()}</b> by PageRank`);
  item(`<b>${f.indeg.toLocaleString()}</b> in`, "Articles linking here, in the whole wiki");
  item(`<b>${f.outdeg.toLocaleString()}</b> out`, "Articles this one links to");
  item(`${(f.len / 1000).toFixed(f.len < 10000 ? 1 : 0)} KB`, "Wikitext length");
  el.append(line);

  // Birth and death years are true categories but poor descriptions; they go after
  // the ones that say what the article is about, before the organising ones.
  const cats = f.categories.map((c) => ({ ...c, order: c.organising ? 2 : /^\d/.test(c.title) ? 1 : 0 }))
    .sort((a, b) => a.order - b.order);
  if (cats.length) {
    const box = document.createElement("div");
    const LIMIT = 6;
    const chip = (c) => {
      const w = document.createElement("span");
      w.className = "cat" + (c.organising ? " org" : "");
      const name = c.title.replace(/_/g, " ");
      const draw = document.createElement("button");
      draw.textContent = name;
      draw.title = `Draw the category tree of ${name}`;
      draw.addEventListener("click", () => {
        $("view").value = "category"; $("q").value = name; syncControls(); draw_();
      });
      const within = document.createElement("button");
      within.className = "within"; within.textContent = "only";
      within.title = `Keep this view, only articles within ${name}`;
      within.addEventListener("click", () => {
        // From a category view there is no article in the box; the one on the card
        // becomes the centre.
        if ($("view").value === "category") { $("view").value = "neighborhood"; $("q").value = label; }
        $("within").value = name; syncControls(); draw_();
      });
      w.append(draw, within);
      return w;
    };
    const draw_ = () => draw();
    cats.slice(0, LIMIT).forEach((c) => box.append(chip(c)));
    if (cats.length > LIMIT) {
      const more = document.createElement("button");
      more.className = "more";
      more.textContent = `+${cats.length - LIMIT} more`;
      more.addEventListener("click", () => { more.remove(); cats.slice(LIMIT).forEach((c) => box.append(chip(c))); });
      box.append(more);
    }
    el.append(box);
  }

  // Since the previous build: in-links that arrived and left. Counts on the line,
  // titles behind a toggle; an arrival on the disc selects its dot.
  const sn = f.since;
  if (sn) {
    const box = document.createElement("div");
    box.className = "since";
    const head = document.createElement("button");
    head.className = "more";
    const plus = sn.gainedCount, minus = sn.lostCount;
    head.textContent = !sn.old ? `new since ${sn.build}`
      : plus || minus ? `since ${sn.build}: ${plus ? `+${plus.toLocaleString()} in-link${plus === 1 ? "" : "s"}` : ""}${plus && minus ? ", " : ""}${minus ? `−${minus.toLocaleString()} gone` : ""}`
      : `unchanged since ${sn.build}`;
    box.append(head);
    if (sn.old && (plus || minus)) {
      const list = document.createElement("div");
      list.hidden = true;
      const group = (name, titles, count, cls) => {
        if (!titles.length) return;
        const h = document.createElement("div"); h.className = "line";
        h.innerHTML = `<b>${name}</b>` + (count > titles.length ? ` (first ${titles.length} of ${count.toLocaleString()})` : "");
        list.append(h);
        const wrap = document.createElement("div");
        for (const t of titles) {
          const c = document.createElement("span");
          c.className = `cat ${cls}`;
          const b = document.createElement("button");
          b.textContent = t;
          const onDisc = disc.labels.has(t);
          b.title = onDisc ? "On the disc — select it" : "Not on this disc — draw around it";
          b.addEventListener("click", () => {
            if (onDisc) disc.api()?.select(t);
            else { $("view").value = "neighborhood"; $("q").value = t; syncControls(); draw(); }
          });
          c.append(b); wrap.append(c);
        }
        list.append(wrap);
      };
      group("arrived", sn.gained, sn.gainedCount, "gained");
      group("left", sn.lost, sn.lostCount, "lost");
      head.addEventListener("click", () => { list.hidden = !list.hidden; });
      box.append(list);
    }
    el.append(box);
  }
  el.hidden = false;
}

function showPreview(el, preview) {
  el.classList.remove("pending");
  el.replaceChildren();
  if (!preview) { el.hidden = true; return; }
  el.hidden = false;
  if (preview.image) {
    const img = document.createElement("img");
    img.src = preview.image;
    img.alt = "";
    img.loading = "lazy";
    img.onerror = () => img.remove();   // a broken thumbnail is worse than none
    el.append(img);
  }
  el.append(document.createTextNode(preview.text));
  // If it all fits, no fade: the fade is a promise of more.
  requestAnimationFrame(() => el.classList.toggle("short", el.scrollHeight <= el.clientHeight + 2));
}

/**
 * The article's lead image: the first photograph in the infobox or a thumbnail, and
 * failing that a large drawing (a map, say). mwoffliner tags every image with
 * data-file-type -- "bitmap" for photographs, "drawing" for flags, seals, signatures,
 * maps -- which is a far better signal than size for what a country's infobox leads
 * with: the flag comes first, and it is never the picture you want on a card. Only a
 * maxi ZIM has images; on a nopic ZIM this finds nothing and the card is as before.
 */
function leadImage(doc, articleUrl) {
  const root = doc.querySelector("#mw-content-text") ?? doc.body;
  const usable = (img) => {
    const src = img.getAttribute("src") ?? "";
    if (!src || /^data:/.test(src) || img.classList.contains("mw-invert")) return null;  // formulae
    const w = Number(img.getAttribute("width")) || 0, h = Number(img.getAttribute("height")) || 0;
    if ((w && w < 60) || (h && h < 60)) return null;                                      // icons
    let href;
    try { href = new URL(src, articleUrl).href; } catch { return null; }
    const type = img.dataset.fileType ?? (/\.svg(\.|$)/i.test(src) ? "drawing" : "bitmap");
    return { href, type, big: w >= 200 && h >= 150 };
  };
  // The infobox is exhausted first -- a photograph, else a large drawing such as the
  // locator map -- before the article body is considered. Otherwise a country, whose
  // infobox holds only flags and a map, gets whichever photograph appears first in its
  // history section.
  const pick = (imgs, allowDrawing) => {
    let drawing = null;
    for (const img of imgs) {
      const c = usable(img);
      if (!c) continue;
      if (c.type === "bitmap") return c.href;
      if (allowDrawing && !drawing && c.big) drawing = c.href;
    }
    return drawing;
  };
  return pick(root.querySelectorAll(".infobox img"), true)
      ?? pick(root.querySelectorAll(".thumb img, figure img, .thumbimage"), false);
}

/**
 * Kiwix's full-text search, paged. Its RSS form lists a <link> per hit and the total;
 * pages are 140 hits at most, so a budget of 1,000 is eight requests, sent a few at
 * a time. Titles come back in Kiwix's ranking, which is what the disc sizes dots by.
 */
async function textHits(pattern, want) {
  const PAGE = 140;
  const page = async (start) => {
    const url = `${info.textSearch}&pattern=${encodeURIComponent(pattern)}&start=${start}&pageLength=${PAGE}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Kiwix search failed (${res.status})`);
    const doc = new DOMParser().parseFromString(await res.text(), "text/xml");
    const total = Number(doc.getElementsByTagNameNS("*", "totalResults")[0]?.textContent ?? 0);
    const titles = [...doc.querySelectorAll("item > link")].map((l) => {
      try { return decodeURIComponent(l.textContent.trim().split("/").pop()).replace(/_/g, " "); } catch { return ""; }
    }).filter(Boolean);
    return { total, titles };
  };
  const first = await page(0);
  const titles = [...first.titles];
  const n = Math.min(first.total, want);
  const starts = [];
  for (let s = PAGE; s < n; s += PAGE) starts.push(s);
  // Four in flight at a time: kiwix-serve is single-process, and eight at once
  // buys nothing over four.
  for (let i = 0; i < starts.length; i += 4) {
    const pages = await Promise.all(starts.slice(i, i + 4).map(page));
    for (const p of pages) titles.push(...p.titles);
  }
  return { total: first.total, titles: titles.slice(0, want) };
}

/**
 * Articles as parsed documents, shared by the preview, the facts and the snippets.
 * A few dozen kept; the same article is asked about many times while a card is open.
 */
const docCache = new Map();
async function fetchDoc(label) {
  const title = label.replace(/ /g, "_");
  if (docCache.has(title)) { const d = docCache.get(title); docCache.delete(title); docCache.set(title, d); return d; }
  let doc = null;
  try {
    const url = `${info.reader}/${encodeURIComponent(title)}`;
    const res = await fetch(url);
    if (res.ok) { doc = new DOMParser().parseFromString(await res.text(), "text/html"); doc.wgUrl = url; }
  } catch {}
  docCache.set(title, doc);
  if (docCache.size > 40) docCache.delete(docCache.keys().next().value);
  return doc;
}

/**

 * is a line on the disc; the sentence is the argument behind it. Looks for the first
 * link to `to` in running text (paragraphs and list items, not infoboxes or navboxes),
 * walks that block's text with references skipped to find the anchor's offset, and
 * cuts the sentence around it. When `from` has no such link the edge was drawn the
 * other way round, so the same is tried from `to`, flagged `reverse`.
 * Returns { text, at, len, reverse } or null; `at`/`len` mark the anchor in `text`.

    let t;

    if (t === want) { anchor = a; break; }

  // falls in it.
  const walker = doc.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement?.closest("sup.reference, .reference, .mw-editsection, style, script")

    text += n.nodeValue;
  }
  if (at < 0) return null;
  const len = anchor.textContent.length;
  // Sentence boundaries: a full stop, question or exclamation mark followed by space
  // and a capital (or a quote/bracket), which is what an abbreviation is usually not.
  const ends = [];
  for (const m of text.matchAll(/[.!?]["')\]]?(?=\s+["(\[]?[A-Z0-9])/g)) ends.push(m.index + m[0].length);

    sentence = (lo ? "…" : "") + sentence.slice(lo, lo + CAP).trimEnd() + "…";
    a2 = a2 - lo + (lo ? 1 : 0);
  }
  return { text: sentence, at: a2, len, reverse: false };
}

/**
 * Links in the lead section -- what the article names before its first heading, in
 * order of appearance, once each. Paragraph links only: the infobox, hatnotes and
 * figure captions in the lead are not the vocabulary the text assumes.
 */
function leadLinks(doc, min = 0) {

  const sections = [...root.querySelectorAll("section[data-mw-section-id]")];
  const seen = new Set(), out = [];

  // on, so when fewer than `min` links come of it the next sections are read too,
  // one at a time, until there are enough.
  for (const lead of sections.length ? sections : [root]) {

    linksIn(doc, root, lead, seen, out);

function linksIn(doc, root, lead, seen, out) {

  // name: "(from Latin quantum, 'how much')" -- and Latin is not what quantum
  // mechanics assumes. Each paragraph's text is walked once to know, at every link,
  // whether a bracket is open.
  const inParens = new Set();
  for (const para of lead.querySelectorAll("p")) {
    let depth = 0;
    const w = doc.createTreeWalker(para, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      const a = n.parentElement?.closest("a[href]");
      if (a && depth > 0) inParens.add(a);
      for (const ch of n.nodeValue) { if (ch === "(") depth++; else if (ch === ")" && depth > 0) depth--; }
    }

  for (const a of lead.querySelectorAll("p a[href]")) {
    if (a.closest("table, .hatnote, .dablink, .ambox, .navbox, figure, .thumb, sup, .reference, .mw-empty-elt")) continue;
    if (inParens.has(a)) continue;
    // Before the first heading only, when the lead section is not marked as such.
    if (lead === root && a.compareDocumentPosition(root.querySelector("h2") ?? a) & Node.DOCUMENT_POSITION_PRECEDING) break;
    let t;
    try {
      const u = new URL(a.getAttribute("href"), doc.wgUrl);
      if (u.origin !== location.origin || u.hash) continue;
      t = decodeURIComponent(u.pathname.split("/").pop()).replace(/_/g, " ");
    } catch { continue; }
    if (!t || /^(File|Category|Help|Wikipedia|Template|Special|Portal|Talk):/i.test(t) || seen.has(t)) continue;
    seen.add(t); out.push(t);

}

/**
 * A reading order for an article: what it assumes, from lead paragraphs. Level one is
 * the target's own lead links -- the concepts its first sentences lean on. Level two
 * is what those articles' leads lean on in turn, kept only when at least two of them
 * share it: a concept that several prerequisites name is the field's vocabulary,
 * one that a single prerequisite names is that article's own business (Max Planck's
 * lead names Germany; the field does not). The basics come first, then what the
 * article builds on directly, then the article. Experimental: whether the order
 * convinces is judged on screen.

async function readingOrder(q) {
  const doc0 = await fetchDoc(q);
  if (!doc0) throw new Error(`no article "${q}" in the reader`);
  const title = reader.titleOf(doc0.wgUrl) || q;
  const L1 = leadLinks(doc0, 8).filter((t) => t !== title).slice(0, 24);
  if (!L1.length) throw new Error(`"${title}" has no links in its lead paragraphs`);
  const l1 = new Set(L1);
  const support = new Map();
  for (let i = 0; i < L1.length; i += 4) {
    const docs = await Promise.all(L1.slice(i, i + 4).map(fetchDoc));
    for (const d of docs) {
      if (!d) continue;
      for (const u of new Set(leadLinks(d, 6))) {
        if (u === title || l1.has(u)) continue;
        support.set(u, (support.get(u) ?? 0) + 1);

}

/**
 * Drawn around a disambiguation page -- "Mercury" typed and drawn as is. The disc is
 * then a disc of the options, which is not nothing, but the wiki would have asked
 * which one; so does this, in a strip: each choice redraws around it.
 */
function dabStrip(dab) {
  const box = $("dab");
  if (!dab || !dab.options?.length) { box.hidden = true; return; }
  $("dabText").innerHTML = `<b>${dab.title}</b> is a disambiguation page. Did you mean:`;
  $("dabChoices").replaceChildren(...dab.options.map((o) => {
    const b = document.createElement("button");
    b.textContent = o.title.replace(/_/g, " ");
    if (o.topic) { const sm = document.createElement("small"); sm.textContent = o.topic; b.append(sm); }
    b.addEventListener("click", () => { $("q").value = o.title.replace(/_/g, " "); draw(); });
    return b;
  }));

$("dabClose").addEventListener("click", () => { $("dab").hidden = true; });

/** The order as a strip under the bar, trimmed to what the server kept (the filters). */
function orderStrip(order, data) {
  const box = $("order"), body = $("orderBody");
  if (!order) { box.hidden = true; body.replaceChildren(); return; }
  const kept = new Map(data.nodes.map((n) => [n.label, n]));
  body.replaceChildren();
  const group = (name, hint, titles, byIndeg) => {
    const rows = titles.filter((t) => kept.has(t));
    if (!rows.length) return 0;
    if (byIndeg) rows.sort((a, b) => (kept.get(b).indeg ?? 0) - (kept.get(a).indeg ?? 0));
    const h = document.createElement("h4");
    h.append(name); const sp = document.createElement("span"); sp.textContent = hint; h.append(sp);
    const ol = document.createElement("ol");
    for (const t of rows) {
      const li = document.createElement("li");
      if (reading.get(t) === "read") { const r = document.createElement("span"); r.className = "read"; r.textContent = "\u2713"; li.append(r); }
      const a = document.createElement("a");
      a.href = "#"; a.textContent = t; a.title = "Read it";
      a.addEventListener("click", (e) => { e.preventDefault(); disc.api()?.select(t); reading.open(t); });
      li.append(a);

      small.textContent = order.support[t] ? `\u00d7${order.support[t]}` : "";
      li.append(small);
      const dr = document.createElement("button");
      dr.innerHTML = "&#8982;"; dr.title = "Draw around this";
      dr.addEventListener("click", () => { $("view").value = "neighborhood"; $("q").value = t; syncControls(); draw(); });

  const n1 = group("Then, what it builds on", "named in its own lead paragraphs", order.L1, true);
  const note = document.createElement("div");
  note.className = "note";

    (n1 + n2 < order.L1.length + order.L2.length ? `${order.L1.length + order.L2.length - n1 - n2} left out by the filters. ` : "") +

$("orderClose").addEventListener("click", () => { $("order").hidden = true; });

/**
 * A path, explained: under the trail, one line per hop with the sentence that makes
 * the link. Only for path views with a reader; anything else clears it. Filled as the
 * fetches come in, in order, since the first hop is the one read first.
 */
let pathWhySeq = 0;
async function pathWhy(titles) {
  const seq = ++pathWhySeq;
  const box = $("pathWhy"), list = $("pathWhyItems");
  if (!titles || titles.length < 2 || !info.reader) { box.hidden = true; list.replaceChildren(); return; }
  list.replaceChildren(...titles.slice(1).map((t, i) => {
    const li = document.createElement("li");
    const hop = document.createElement("span");
    hop.className = "hop"; hop.textContent = `${titles[i]} → ${t}`;
    li.append(hop, " — ", "…");
    return li;
  }));
  box.hidden = false;
  for (let i = 1; i < titles.length; i++) {
    const sn = await linkSnippet(titles[i - 1], titles[i]);
    if (seq !== pathWhySeq) return;   // a newer draw took over
    const li = list.children[i - 1];
    li.lastChild.remove();
    const out = snippetNode(sn, titles[i - 1], titles[i]);
    if (!sn) { const e = document.createElement("span"); e.className = "none"; e.append(out); li.append(e); }

}
$("pathWhyClose").addEventListener("click", () => { $("pathWhy").hidden = true; });

/** The snippet as DOM: the sentence with the link text in bold. */
function snippetNode(sn, from, to) {
  const frag = document.createDocumentFragment();
  if (!sn) { frag.append("no sentence found — the link is in a table or a navbox"); return frag; }
  if (sn.reverse) { const i = document.createElement("i"); i.textContent = `${to} → ${from}: `; frag.append(i); }
  frag.append(sn.text.slice(0, sn.at));
  const b = document.createElement("b"); b.textContent = sn.text.slice(sn.at, sn.at + sn.len); frag.append(b);
  frag.append(sn.text.slice(sn.at + sn.len));

function firstParagraph(doc) {

    // not the article's own opening sentence.
    if (p.closest("table, .hatnote, .dablink, .navbox, .reflist, .mw-empty-elt, .thumb, figure")) continue;
    for (const sup of p.querySelectorAll("sup, .reference, .mw-editsection")) sup.remove();

    // Cut at a sentence end past ~500 characters, so the fade lands between thoughts.
    if (t.length > 640) {
      const cut = t.slice(0, 640).search(/[.!?]\s[^.!?]*$/);
      return cut > 300 ? t.slice(0, cut + 1) : t.slice(0, 600) + "…";
    }
    return t;
  }
  return null;
}

/**
 * The walk, made visible. Every draw of a neighbourhood-type view around a new
 * article adds a step; the strip shows them in order and each is a link back to that
 * disc -- its hash, restored without touching the browser history, which is the
 * other, blind record of the same walk. Session-only: a walk is a session, not a
 * place. Distinct from the game bar (a game) and from the card's own trail (moves
 * within one disc).
 */
const trail = { steps: [], at: -1, jumping: false };

function trailRecord(view, q) {
  if (!["neighborhood", "in", "out"].includes(view) || !q) return;
  // A jump along the strip only moves the marker; it is not a new step.
  if (trail.jumping) { trail.jumping = false; renderTrail(); return; }
  const here = trail.steps[trail.at];
  if (here && here.q === q && here.view === view) { renderTrail(); return; }   // redraw in place
  // Stepping back and then somewhere new starts a new branch from that point.
  if (trail.at >= 0 && trail.at < trail.steps.length - 1) trail.steps.length = trail.at + 1;
  trail.steps.push({ view, q, hash: location.hash });
  trail.at = trail.steps.length - 1;
  renderTrail();
}

function renderTrail() {
  const el = $("trail");
  if (trail.steps.length < 2) { el.hidden = true; return; }
  el.hidden = false;
  const items = trail.steps.map((s, i) => {
    const a = document.createElement("a");
    a.href = s.hash;
    a.textContent = s.q;
    a.title = s.view === "in" ? `what links to ${s.q}` : s.view === "out" ? `what ${s.q} links to` : `around ${s.q}`;
    if (i === trail.at) a.classList.add("here");
    a.addEventListener("click", (e) => {
      e.preventDefault();
      trail.at = i;
      trail.jumping = true;
      history.pushState(null, "", s.hash);
      readHash(); syncControls();
      draw({ push: false, fromGame: !!game });
    });
    return a;
  });
  // Past eight, collapse the middle: the start and the last few are what you reach for.
  const shown = items.length > 8 ? [items[0], "…", ...items.slice(-6)] : items;
  const box = $("trailItems");
  box.replaceChildren();
  shown.forEach((it, i) => {
    if (i) { const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "→"; box.append(sep); }
    box.append(it === "…" ? Object.assign(document.createElement("span"), { textContent: "…", className: "sep" }) : it);
  });
}

$("trailClear").addEventListener("click", () => { trail.steps = []; trail.at = -1; renderTrail(); });

/**
 * Six degrees. Two random well-linked articles; the player walks from one to the other
 * with "Draw around this", and at the end the route is set against the shortest one.
 * Everything it needs already exists -- /api/random, the recenter hook, the path view
 * -- so the game is a little state and a bar that reports it. The state is not in the
 * URL: a game is a session, not a place to link to.
 */
let game = null;

const setHtml = (id, html) => { $(id).innerHTML = html; };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function pickPair() {
  // A pair with a real gap: at least three hops apart, so neither one click nor a
  // shared hub settles it. A few tries, then whatever we have.
  const filters = `hide=${hideValue()}&minlen=${$("minlen").value}`;
  for (let attempt = 0; attempt < 6; attempt++) {
    const a = await (await fetch(`api/random?${filters}`)).json();
    const b = await (await fetch(`api/random?${filters}`)).json();
    if (a.error || b.error || a.title === b.title) continue;
    const p = await (await fetch(`api/view/path?from=${encodeURIComponent(a.title)}&to=${encodeURIComponent(b.title)}&limit=10&${filters}`)).json();
    if (p.error) continue;
    if (p.pathTitles.length - 1 >= 3 || attempt === 5) return { from: a.title, to: b.title, shortest: p.pathTitles };
  }
  return null;
}

async function startGame() {
  $("play").disabled = true;
  status("picking two articles…");
  const pair = await pickPair();
  $("play").disabled = false;
  if (!pair) { status("could not find a pair under the current filters", true); return; }
  game = { from: pair.from, to: pair.to, shortest: pair.shortest, trail: [pair.from], done: false };
  $("game").hidden = false;
  $("gameShortest").hidden = $("gameAgain").hidden = true;
  $("gameQuit").hidden = false;
  setHtml("gameResult", "");
  renderGame();
  $("view").value = "neighborhood";
  $("q").value = pair.from;
  syncControls();
  draw({ fromGame: true });
}

function endGame() {
  game = null;
  $("game").hidden = true;
}

function renderGame() {
  setHtml("gameGoal", `&#127919; Reach <b>${esc(game.to)}</b> from <b>${esc(game.from)}</b>`);
  const steps = game.trail.length - 1;
  setHtml("gameTrail", `${steps} step${steps === 1 ? "" : "s"}: ${game.trail.map(esc).join(" → ")}`);
}

function gameStep(label) {
  if (!game || game.done) return;
  if (label === game.trail[game.trail.length - 1]) return;
  game.trail.push(label);
  renderGame();
  if (label === game.to) finishGame();
}

function finishGame(gaveUp = false) {
  game.done = true;
  const yours = game.trail.length - 1, best = game.shortest.length - 1;
  const verdict = gaveUp ? `Gave up after ${yours} step${yours === 1 ? "" : "s"}.`
    : yours === best ? `&#127942; ${yours} steps — that is the shortest route.`
    : `Made it in ${yours} steps; the shortest is ${best}.`;
  setHtml("gameResult", `${verdict} Shortest: ${game.shortest.map(esc).join(" → ")}`);
  $("gameQuit").hidden = true;
  $("gameShortest").hidden = $("gameAgain").hidden = false;
}

$("play").addEventListener("click", startGame);
$("gameAgain").addEventListener("click", startGame);
$("gameClose").addEventListener("click", endGame);
$("gameShortest").addEventListener("click", () => {
  $("view").value = "path";
  $("q").value = game.from;
  $("q2").value = game.to;
  syncControls();
  draw({ fromGame: true });
});
$("gameQuit").addEventListener("click", () => finishGame(true));

// Typeahead straight off the title index, shared by both inputs.
let searchTimer;
const typeahead = (el) => () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const v = el.value.trim();
    if (v.length < 2) return;
    const kind = $("view").value === "category" ? "&kind=category" : "";
    const w = $("within").value.trim();
    const hits = await (await fetch(`api/search?q=${encodeURIComponent(v)}&hide=${hideValue()}&minlen=${$("minlen").value}&rank=${$("rank").value}${kind}` +
                                    (w && !kind ? `&within=${encodeURIComponent(w)}` : ""))).json();
    // A hit found through a redirect shows the name that matched, so "usa" reads
    // "United States — via USA" rather than a title that does not contain the query.
    // A disambiguation page is not a choice; its options are. They lead the list,
    // each saying which "Mercury" it is, so the box offers the planet, the element and
    // the god rather than the page that only lists them.
    const dab = hits.find((h) => h.dab);
    const choices = dab ? dab.options.map((o) =>
      `<option value="${o.title.replace(/_/g, " ")}" label="one of ${dab.title.replace(/_/g, " ")}${o.topic ? ` · ${o.topic}` : ""}">`) : [];
    const rest = hits.filter((h) => !h.dab && !(dab && dab.options.some((o) => o.idx === h.idx)));
    $("hits").innerHTML = choices.concat(rest
      .map((h) => `<option value="${h.title.replace(/_/g, " ")}"` +
                  (h.via ? ` label="via ${h.via}"` : "") + `>`)).join("");
  }, 180);
};
