<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikigraph</title>
<!-- The disc as an icon: four wedges, two rings, the pinned article in the hub. SVG
     for browsers that take it, PNG for Safari and the tab strip, a 180px plate for an
     iOS home screen. -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#14161a">
<link rel="stylesheet" href="vendor/page.css">
<style>
  /* The chrome around the disc. page.css is scoped entirely under `.vault-graph`, so
     it styles nothing out here and the shell has to size itself. */
  html, body { height: 100%; margin: 0; background: #14161a; color: #e8e8ea;
               font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }

  #bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         padding: 8px 12px; background: #1b1e24; border-bottom: 1px solid #2c313a; }
  #bar strong { color: #9fd0ff; letter-spacing: .02em; margin-right: 4px; }
  #bar label { color: #8b93a1; }
  select, input, button {
    font: inherit; background: #23272f; color: #e8e8ea;
    border: 1px solid #333944; border-radius: 5px; padding: 4px 8px;
  }
  input[type=text] { width: 220px; }
  button { cursor: pointer; }
  button:hover { background: #2c323c; }
  #hide { display: inline-flex; gap: 10px; align-items: center; padding-left: 10px;
          border-left: 1px solid #2c313a; }
  #hide label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer;
                white-space: nowrap; }
  #hide input { margin: 0; accent-color: #9fd0ff; }
  #mutualLabel { display: inline-flex; gap: 4px; align-items: center; cursor: pointer;
                 white-space: nowrap; padding-left: 10px; border-left: 1px solid #2c313a; }
  #mutualLabel input { margin: 0; accent-color: #9fd0ff; }
  #withinLabel { padding-left: 10px; border-left: 1px solid #2c313a; }
  #within { width: 160px; }
  #status { margin-left: auto; color: #8b93a1; }
  #status.err { color: #ff8b8b; }

  #game { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
          padding: 6px 12px; background: #1f2a1c; border-bottom: 1px solid #2f4a2a; }
  /* An author `display` beats the browser's own [hidden] rule, so the attribute alone
     left the bar on screen from the first load. Say it explicitly. */
  #game[hidden] { display: none; }
  #game b { color: #b6f09c; }
  #gameTrail { color: #8b93a1; }
  #gameResult { color: #e8e8ea; }
  #game button { padding: 2px 8px; }
  #gameClose { margin-left: auto; }
  #main { flex: 1; min-height: 0; display: flex; position: relative; }
  #mount { flex: 1; min-width: 0; position: relative; }
  #mount > .vault-graph { height: 100%; }

  /* The article beside the disc. Width is the reader's, in a CSS variable the divider
     drags; the disc takes the rest and re-fits itself (upstream watches its own box). */
  #reader { width: var(--reader-w, 44%); min-width: 320px; max-width: 75%; z-index: 10;
            display: flex; flex-direction: column; background: #14161a; border-left: 1px solid #2c313a; }
  #reader[hidden], #divider[hidden] { display: none; }
  #divider { width: 6px; cursor: col-resize; background: #1b1e24; flex: none; }
  #divider:hover, #divider.dragging { background: #3987e5; }
  #readerBar { display: flex; gap: 8px; align-items: center; padding: 6px 10px;
               background: #1b1e24; border-bottom: 1px solid #2c313a; color: #e8e8ea; }
  #readerTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; font-weight: 600; }
  #readerBar button, #readerBar a { padding: 2px 8px; font: inherit; color: #e8e8ea;
                                    background: #23272f; border: 1px solid #333944;
                                    border-radius: 5px; text-decoration: none; cursor: pointer; }
  /* The article arrives styled white by mwoffliner's Vector skin; a dark stylesheet is
     injected on load (same origin). Until then the frame is transparent, so the page
     never flashes white between the load and the injection. */
  #readerFrame { flex: 1; border: 0; width: 100%; background: #14161a; opacity: 0;
                 transition: opacity .15s; color-scheme: dark; }
  #readerFrame.themed { opacity: 1; }
  /* Too narrow for two columns: the reader floats over the disc instead of crushing it. */
  @media (max-width: 900px) {
    #reader { position: absolute; right: 0; top: 0; bottom: 0; width: 88%; max-width: none;
              box-shadow: -8px 0 24px rgba(0,0,0,.5); }
    #divider { display: none !important; }
  }
</style>
</head>
<body>

<div id="bar">
  <strong>Wikigraph</strong>

  <label for="view">View</label>
  <select id="view">
    <option value="neighborhood" selected>Around an article</option>
    <option value="in">What links here</option>
    <option value="out">What it links to</option>
    <option value="path">Path between two</option>
    <option value="common">Common ground of two</option>
    <option value="category">Category tree</option>
    <option value="top">Most linked-to</option>
  </select>

  <input type="text" id="q" list="hits" placeholder="Physics" value="Physics">
  <label for="q2" id="q2Label" hidden>→</label>
  <input type="text" id="q2" list="hits" placeholder="Napoleon" value="Napoleon" hidden>
  <datalist id="hits"></datalist>

  <label for="limit">Nodes</label>
  <select id="limit">
    <option>1000</option><option selected>2500</option>
    <option>4000</option><option>6000</option>
  </select>

  <label for="hops" id="hopsLabel">Hops</label>
  <select id="hops"><option>1</option><option selected>2</option><option>3</option></select>

  <button id="go">Draw</button>
  <button id="random" title="A random well-linked article as the centre, respecting the filters. With 'Draw around this' on the card, an aimless walk.">&#127922; Surprise me</button>
  <button id="play" title="Six degrees: two random articles; get from one to the other by clicking 'Draw around this', then see how your route compares with the shortest.">&#127919; Six degrees</button>

  <label for="group" title="Topic: how the wiki files these articles. Cluster: how they actually hang together, by modularity on the links drawn — each wedge named after its three most linked-to members.">Wedges</label>
  <select id="group">
    <option value="topic" selected>by topic</option>
    <option value="cluster">by cluster</option>
  </select>

  <label for="rank" id="rankLabel" title="What 'important' means when a view chooses which articles to show. In-degree counts links; PageRank weighs each by where it comes from, so a mention in a navbox on a thousand stubs counts for less than one from a major article.">Rank</label>
  <select id="rank">
    <option value="indegree" selected>by in-degree</option>
    <option value="pagerank">by PageRank</option>
  </select>

  <span id="hide" title="Kinds of page to leave out of every view">
    <label>Hide</label>
    <label><input type="checkbox" value="list" checked> lists</label>
    <label><input type="checkbox" value="date" checked> dates</label>
    <label><input type="checkbox" value="dab" checked> disambiguation</label>
    <label><input type="checkbox" value="infra" checked> infobox links</label>
    <label for="minlen" title="Skip articles shorter than this. Length is bytes of wikitext; 1 KB is roughly 150 words.">shorter than</label>
    <select id="minlen">
      <option value="0">any length</option>
      <option value="500">500 B</option>
      <option value="1000" selected>1 KB</option>
      <option value="2000">2 KB</option>
      <option value="5000">5 KB</option>
      <option value="10000">10 KB</option>
    </select>
  </span>

  <label id="mutualLabel" title="Draw and follow only links that go both ways. A one-way link is a mention; a mutual one means the two articles are about each other.">
    <input type="checkbox" id="mutual"> mutual links only
  </label>

  <label for="within" id="withinLabel" title="Only articles filed under this category or its subcategories, three levels down. Seeds and path endpoints are always allowed.">within</label>
  <input type="text" id="within" list="cathits" placeholder="any category">
  <datalist id="cathits"></datalist>

  <span id="status">loading…</span>
</div>

<div id="game" hidden>
  <span id="gameGoal"></span>
  <span id="gameTrail"></span>
  <span id="gameResult"></span>
  <button id="gameShortest" hidden>Show the shortest path</button>
  <button id="gameAgain" hidden>Play again</button>
  <button id="gameQuit">Give up</button>
  <button id="gameClose" title="Close the game" aria-label="Close the game">&times;</button>
</div>

<div id="main">
  <div id="mount"></div>
  <div id="divider" hidden title="Drag to resize"></div>
  <aside id="reader" hidden>
    <div id="readerBar">
      <button id="readerBack" title="Back, within the article panel">&#8592;</button>
      <span id="readerTitle"></span>
      <button id="readerRecenter" title="Redraw the disc around the article being read">&#8982; Draw around this</button>
      <a id="readerExternal" target="_blank" rel="noopener" title="Open in a new tab">&#8599;</a>
      <button id="readerClose" title="Close the article panel">&times;</button>
    </div>
    <iframe id="readerFrame" title="Article"></iframe>
  </aside>
</div>

<script src="vendor/engine.js"></script>
<script type="module">
import { mountVaultGraph } from "./vendor/page.js";

const $ = (id) => document.getElementById(id);
const status = (msg, err = false) => {
  $("status").textContent = msg;
  $("status").classList.toggle("err", err);
};

let info = {};
try {
  info = await (await fetch("api/info")).json();
} catch {
  status("API unreachable", true);
}

// The markup lives in vendor/page.html; pulling it in at runtime keeps this shell free
// of a build step.
const markup = await (await fetch("vendor/page.html")).text();

/**
 * The controls are the state, and the URL hash mirrors them -- so any view can be
 * bookmarked, sent to someone, or stepped back through with the browser's own back
 * button. The hash rather than the query string: it never reaches the server, so a
 * shared link is just a link and the API stays cacheable by path.
 */
const FIELDS = ["view", "q", "q2", "limit", "hops", "minlen", "within", "group", "rank"];
const hideBoxes = () => [...document.querySelectorAll("#hide input")];
const hideValue = () => hideBoxes().filter((b) => b.checked).map((b) => b.value).join(",");

function readHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (![...h.keys()].length) return false;
  for (const f of FIELDS) {
    if (!h.has(f)) continue;
    const el = $(f), v = h.get(f);
    el.value = v;
    // A shared link may carry a value the dropdown does not list (limit=600, say).
    // Setting it leaves the select blank and the request without the value, so the
    // option is added rather than the URL's intent dropped.
    if (el.tagName === "SELECT" && el.value !== v && /^\d+$/.test(v)) {
      const opt = new Option(v, v, true, true);
      el.append(opt);
      el.value = v;
    }
  }
  if (h.has("hide")) {
    const on = new Set(h.get("hide").split(","));
    for (const b of hideBoxes()) b.checked = on.has(b.value);
  }
  $("mutual").checked = h.get("mutual") === "1";
  if (!h.has("group")) $("group").value = "topic";
  if (!h.has("rank")) $("rank").value = "indegree";
  return true;
}

function writeHash(push) {
  const h = new URLSearchParams();
  const view = $("view").value;
  for (const f of FIELDS) {
    // Only what the view actually uses, so the link says what it shows.
    if (f === "q2" && !["path", "common"].includes(view)) continue;
    if (f === "hops" && !["neighborhood", "in", "out"].includes(view)) continue;
    if (f === "q" && view === "top") continue;
    if (f === "group" && $(f).value === "topic") continue;
    if (f === "rank" && $(f).value === "indegree") continue;
    // The category view is already a category; "within" would only repeat it.
    if (f === "within" && (view === "category" || !$(f).value.trim())) continue;
    h.set(f, $(f).value.trim());
  }
  h.set("hide", hideValue());
  if ($("mutual").checked) h.set("mutual", "1");
  const next = "#" + h.toString();
  if (next === location.hash) return;
  if (push) history.pushState(null, "", next); else history.replaceState(null, "", next);
}

async function draw({ push = true, fromGame = false } = {}) {
  // The game bar belongs to a game in progress. A draw the game did not ask for --
  // the Draw button, a changed view or filter, Surprise me, the back button -- means
  // the player has moved on, so the game ends and its bar goes with it.
  if (game && !fromGame) endGame();

  const view = $("view").value;
  const q = $("q").value.trim();
  const limit = $("limit").value;
  writeHash(push);

  const t = encodeURIComponent(q);
  const w = $("within").value.trim();
  const hide = `&hide=${hideValue()}&minlen=${$("minlen").value}&group=${$("group").value}&rank=${$("rank").value}` +
               ($("mutual").checked ? "&mutual=1" : "") +
               (w && view !== "category" ? `&within=${encodeURIComponent(w)}` : "");
  const url = (
    view === "top" ? `api/view/top?limit=${limit}`
    : view === "category" ? `api/view/category?title=${t}&limit=${limit}&depth=3`
    : view === "path" ? `api/view/path?from=${t}&to=${encodeURIComponent($("q2").value.trim())}&limit=${limit}`
    : view === "common" ? `api/view/common?from=${t}&to=${encodeURIComponent($("q2").value.trim())}&limit=${limit}`
    : `api/view/neighborhood?title=${t}&limit=${limit}&hops=${$("hops").value}` +
      `&direction=${view === "neighborhood" ? "both" : view}`) + hide;

  status("querying…");
  const t0 = performance.now();
  let data;
  try {
    const res = await fetch(url);
    data = await res.json();
    if (!res.ok) throw new Error(data.error ?? res.statusText);
  } catch (e) {
    status(e.message, true);
    return;
  }
  const queried = Math.round(performance.now() - t0);

  // mountVaultGraph builds its whole scene from the element it is given, so a fresh
  // one per view is the honest way to swap datasets -- reusing the node would leave
  // the previous disc's locks (band, geometry, normalisation box) in place, and those
  // are deliberately derived once at load.
  $("mount").innerHTML = markup;

  const t1 = performance.now();
  mountVaultGraph($("mount").querySelector("#vg-app"), data, {
    Graph: window.VaultGraphEngine.GraphStore,
    Renderer: window.VaultGraphEngine.Renderer,
    settingsUI: false,
    // The detail card's "read" button. No `/A/` namespace: ZIMs built since 2021 put
    // articles at /content/<book>/<Title> directly. Returning nothing (no ZIM
    // configured) makes the page omit the button rather than draw a dead one.
    articleHref: (label) =>
      info.reader ? `${info.reader}/${encodeURIComponent(label.replace(/ /g, "_"))}` : "",
    // A plain click on that button opens the article beside the disc; the href still
    // works for middle-click and the ↗ in the panel, so a new tab remains one gesture away.
    onOpen: (label, href) => reader.show(href, label),
    // What the view is about sits in the hub -- upstream's own "pin to hub" feature:
    // the seed of a neighbourhood, the chain of a path, both seeds of common ground.
    pinned: data.pinned ?? [],
    // "Draw around this" on the card: a new neighbourhood with that article as the
    // seed. This is what turns a picture into a walk -- each click is a page in the
    // history, so the back button retraces it.
    onRecenter: (label) => {
      $("view").value = "neighborhood";
      $("q").value = label;
      syncControls();
      const playing = !!game && !game.done;
      gameStep(label);
      draw({ fromGame: playing || (!!game && game.done) });
    },
    // The first paragraph, from Kiwix, in the card. Only offered when a reader is
    // configured; without one the card simply has no preview block.
    articlePreview: info.reader ? articlePreview : undefined,
  });
  const drawn = Math.round(performance.now() - t1);
  // The legend heading is static markup; say what the wedges are this time.
  const heading = $("mount").querySelector("#vg-legend")?.previousElementSibling?.querySelector(".lbl")
    ?? [...$("mount").querySelectorAll(".lbl")].find((el) => /^(Topics|Clusters|Subcategories)/.test(el.textContent));
  if (heading) {
    const word = $("group").value === "cluster" ? "Clusters" : view === "category" ? "Subcategories" : "Topics";
    heading.childNodes[0].textContent = word + " ";
  }

  // During a game the disc's own search is pointed at the target, so it lights up
  // the moment it is within reach -- seeing it is fair; finding the way there is the game.
  if (game && !game.done) {
    const vq = $("mount").querySelector("#vg-q");
    if (vq) { vq.value = game.to; vq.dispatchEvent(new Event("input", { bubbles: true })); }
  }

  status((data.within ? `${data.within.articles.toLocaleString()} articles under ${data.within.name} · ` : "") +
         (data.pathTitles ? data.pathTitles.join(" → ") + " · " : "") +
         (data.common ? `both link to ${data.common.cited}, ${data.common.citing} link to both · ` : "") +
         `${data.nodes.length.toLocaleString()} articles · ` +
         `${data.edges.length.toLocaleString()} links · ${queried}ms query · ${drawn}ms draw`);
}

/**
 * The reader: the article beside the disc, in an iframe on the same origin (Kiwix is
 * behind the same hostname), so the frame is ours to read -- its current URL gives
 * the title, and links inside it are plain relative hrefs that navigate the frame on
 * their own. The panel follows what you open; it is not part of the URL, since the
 * view is the URL and the article is what you happen to be reading.
 */
const reader = {
  el: $("reader"), frame: $("readerFrame"), open: false,
  // Its own back-stack. An iframe shares the joint session history with the window,
  // so a link click in the article and a recenter of the disc land in one list, and
  // "back" in the panel would undo whichever came last -- the disc, as it turned out.
  // Every navigation in the frame goes through location.replace(), which adds no
  // history entry, and the panel remembers where it has been itself. Browser back
  // is then the disc's history only; the panel's ← is the panel's only.
  stack: [],
  go(url) {
    this.frame.classList.remove("themed");   // the next document arrives white too
    const win = this.frame.contentWindow;
    if (win && win.location.href !== "about:blank") win.location.replace(url);
    else this.frame.src = url;
  },
  titleOf(url) {
    // /kiwix/content/<book>/<Title> -> Title, underscores to spaces.
    try { return decodeURIComponent(new URL(url).pathname.split("/").pop()).replace(/_/g, " "); }
    catch { return ""; }
  },
  show(href, label) {
    if (!info.reader) return;
    this.open = true;
    this.el.hidden = $("divider").hidden = false;
    $("readerTitle").textContent = label;
    $("readerExternal").href = href;
    const cur = this.frame.contentWindow?.location?.href;
    if (cur && cur !== "about:blank" && cur !== href) this.stack.push(cur);
    if (cur !== href) this.go(href);
  },
  back() {
    const prev = this.stack.pop();
    if (prev) this.go(prev);
  },
  close() {
    this.open = false;
    this.el.hidden = $("divider").hidden = true;
  },
  current() { return this.titleOf(this.frame.contentWindow?.location?.href ?? this.frame.src); },
};

/**
 * The article in the page's own colours. mwoffliner ships the Vector skin, white on
 * white; this overrides its surfaces and text with the palette the rest of Wikigraph
 * uses, targeting the skin's classes rather than fighting its selectors one by one.
 * Images are left alone.
 */
const READER_THEME = `
  :root { color-scheme: dark; }
  html, body, .mw-page-container, .mw-page-container-inner, .mw-body, .mw-body-content,
  .vector-body, .mw-parser-output, .mw-content-container {
    background: #14161a !important; color: #e8e8ea !important;
  }
  body { font-size: 15px; line-height: 1.55; }
  .mw-body { padding: 8px 18px 40px; margin: 0; border: 0; }
  h1, h2, h3, h4, h5, .mw-headline, #firstHeading, .firstHeading {
    color: #f2f2f4 !important; border-color: #2c313a !important;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a, a:visited { color: #9fd0ff !important; }
  a:hover { color: #c9e4ff !important; }
  a.new, a.new:visited { color: #ff8b8b !important; }
  a.external { color: #7fc8a9 !important; }
  .infobox, table.wikitable, .navbox, .toccolours, .sidebar, .box-Multiple_issues, .ambox,
  .mbox, .tmbox, table.metadata, .mw-collapsible, .catlinks, .mw-references-wrap, .refbegin {
    background: #1b1e24 !important; color: #e8e8ea !important; border-color: #2c313a !important;
  }
  .infobox th, table.wikitable th, .navbox th, .infobox-header, .infobox-above, .sidebar-title,
  .infobox caption, .navbox-title, .navbox-group {
    background: #23272f !important; color: #e8e8ea !important;
  }
  .infobox td, .infobox th, table.wikitable td, table.wikitable th { border-color: #2c313a !important; }
  .infobox-subheader, .infobox-below, .infobox-data, .infobox-label { color: #e8e8ea !important; }
  tr, td, th { background-color: transparent !important; }
  .infobox [style*="background"], .navbox [style*="background"] { background: #23272f !important; }
  figure, .thumb, .thumbinner, .thumbcaption, figcaption, .gallerybox, .gallerytext {
    background: #1b1e24 !important; color: #8b93a1 !important; border-color: #2c313a !important;
  }
  .hatnote, .dablink, .rellink, .mw-editsection, .noprint, .mw-empty-elt, .reference-text {
    color: #8b93a1 !important;
  }
  .hatnote, .dablink { background: transparent !important; border-color: #2c313a !important; }
  hr { border-color: #2c313a; }
  code, pre, tt, .mw-highlight { background: #23272f !important; color: #e8e8ea !important;
                                  border-color: #2c313a !important; }
  blockquote { border-left: 3px solid #2c313a; color: #c4c9d2; }
  sup.reference a { color: #9fd0ff !important; }
  .zim-footer, #footer, .printfooter { color: #8b93a1 !important; border-color: #2c313a !important;
                                       background: transparent !important; }
  img.mw-file-element, .infobox img, .thumbimage { border-radius: 3px; }
  /* Formulae are black-on-transparent SVGs; MediaWiki marks them .mw-invert for exactly
     this case, and so are a few icons that would otherwise vanish on a dark ground. */
  .mw-invert, .skin-invert, .mwe-math-fallback-image-inline, .mwe-math-fallback-image-display {
    filter: invert(1) hue-rotate(180deg);
  }
  ::selection { background: #3987e5; color: #fff; }
`;

function themeFrame() {
  try {
    const doc = reader.frame.contentDocument;
    if (!doc?.head) return;
    if (!doc.getElementById("wg-theme")) {
      const style = doc.createElement("style");
      style.id = "wg-theme";
      style.textContent = READER_THEME;
      doc.head.appendChild(style);
    }
  } catch {}
  reader.frame.classList.add("themed");
}

// Every navigation inside the frame -- a link click, back -- lands here.
reader.frame.addEventListener("load", () => {
  themeFrame();
  const url = reader.frame.contentWindow?.location?.href;
  if (!url) return;
  const title = reader.titleOf(url);
  if (title) $("readerTitle").textContent = title;
  $("readerExternal").href = url;
  // Links off the wiki (mwoffliner keeps a "view on wikipedia.org" link, and citations)
  // leave the panel for a tab rather than steering the frame onto the internet.
  try {
    reader.frame.contentDocument.addEventListener("click", (ev) => {
      const a = ev.target.closest?.("a[href]");
      if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
      const target = new URL(a.getAttribute("href"), url);
      if (target.origin !== location.origin) {
        ev.preventDefault(); window.open(target.href, "_blank", "noopener"); return;
      }
      if (target.hash && target.pathname === new URL(url).pathname) return;   // in-page anchor
      ev.preventDefault();
      reader.stack.push(url);
      reader.go(target.href);
    });
  } catch {}
  $("readerBack").disabled = reader.stack.length === 0;
});
$("readerClose").addEventListener("click", () => reader.close());
$("readerBack").addEventListener("click", () => reader.back());
$("readerRecenter").addEventListener("click", () => {
  const t = reader.current();
  if (!t) return;
  $("view").value = "neighborhood";
  $("q").value = t;
  syncControls();
  gameStep(t);
  draw({ fromGame: !!game });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && reader.open) reader.close(); });

// The divider: drag to set the reader's width, remembered per browser.
{
  const div = $("divider");
  let dragging = false;
  div.addEventListener("pointerdown", (e) => { dragging = true; div.classList.add("dragging"); div.setPointerCapture(e.pointerId); });
  div.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const w = Math.max(320, Math.min(window.innerWidth * 0.75, window.innerWidth - e.clientX));
    document.documentElement.style.setProperty("--reader-w", w + "px");
  });
  div.addEventListener("pointerup", () => {
    dragging = false; div.classList.remove("dragging");
    try { localStorage.setItem("wikigraph:reader-w", document.documentElement.style.getPropertyValue("--reader-w")); } catch {}
  });
  try {
    const w = localStorage.getItem("wikigraph:reader-w");
    if (w) document.documentElement.style.setProperty("--reader-w", w);
  } catch {}
}

/**
 * Fill the card's preview element with the article's first paragraph.
 *
 * Kiwix sits behind the same hostname as this page, so the fetch is same-origin: no
 * CORS, no proxy, nothing for the API to do. The HTML is mwoffliner's, which keeps
 * the article body under `#mw-content-text`; the intro is the first real paragraph
 * there -- past the hatnotes ("For other uses, see …"), past the infobox table, past
 * the empty `<p>` mwoffliner leaves around block elements.
 *
 * Cached per title for the session, and the previous fetch is aborted when the
 * selection moves on, so a fast walk through the linked-articles list does not queue
 * up a dozen requests whose answers arrive for cards that are already gone.
 */
const previewCache = new Map();
let previewAbort = null;

async function articlePreview(label, el) {
  if (previewAbort) previewAbort.abort();
  const ctl = new AbortController();
  previewAbort = ctl;

  const title = label.replace(/ /g, "_");
  if (previewCache.has(title)) return showPreview(el, previewCache.get(title));

  el.hidden = false;
  el.classList.add("pending");
  el.textContent = "loading…";

  let preview = null;
  try {
    const url = `${info.reader}/${encodeURIComponent(title)}`;
    const res = await fetch(url, { signal: ctl.signal });
    if (res.ok) {
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      const text = firstParagraph(doc);
      preview = text ? { text, image: leadImage(doc, url) } : null;
    }
  } catch (e) {
    if (e.name === "AbortError") return;   // superseded; the next card is drawing
  }
  previewCache.set(title, preview);
  if (!ctl.signal.aborted) showPreview(el, preview);
}

function showPreview(el, preview) {
  el.classList.remove("pending");
  el.replaceChildren();
  if (!preview) { el.hidden = true; return; }
  el.hidden = false;
  if (preview.image) {
    const img = document.createElement("img");
    img.src = preview.image;
    img.alt = "";
    img.loading = "lazy";
    img.onerror = () => img.remove();   // a broken thumbnail is worse than none
    el.append(img);
  }
  el.append(document.createTextNode(preview.text));
  // If it all fits, no fade: the fade is a promise of more.
  requestAnimationFrame(() => el.classList.toggle("short", el.scrollHeight <= el.clientHeight + 2));
}

/**
 * The article's lead image: the first picture in the infobox or the first thumbnail,
 * skipping the icons that share those places -- flags, coats of arms, the little
 * "edit" and "listen" symbols. Only a maxi ZIM has images at all; on a nopic ZIM this
 * finds nothing and the card is as before.
 */
function leadImage(doc, articleUrl) {
  const root = doc.querySelector("#mw-content-text") ?? doc.body;
  for (const img of root.querySelectorAll(".infobox img, .thumb img, figure img, .thumbimage")) {
    const w = Number(img.getAttribute("width")) || 0, h = Number(img.getAttribute("height")) || 0;
    const src = img.getAttribute("src") ?? "";
    // Icons are small, and mwoffliner keeps the source dimensions on the tag.
    if ((w && w < 60) || (h && h < 60)) continue;
    if (/\.svg(\.|$)/i.test(src) && (w < 120 || h < 120)) continue;  // flags, seals, symbols
    if (!src || /^data:/.test(src)) continue;
    try { return new URL(src, articleUrl).href; } catch { continue; }
  }
  return null;
}

function firstParagraph(doc) {
  const root = doc.querySelector("#mw-content-text") ?? doc.body;
  for (const p of root.querySelectorAll("p")) {
    // Anything inside a table (infobox), a hatnote, a navbox, or a reference block is
    // not the article's own opening sentence.
    if (p.closest("table, .hatnote, .dablink, .navbox, .reflist, .mw-empty-elt, .thumb, figure")) continue;
    for (const sup of p.querySelectorAll("sup, .reference, .mw-editsection")) sup.remove();
    const t = p.textContent.replace(/\s+/g, " ").replace(/\[\d+\]/g, "").trim();
    // A coordinate line or a one-word stub caption is not an intro either.
    if (t.length < 40 || /^Coordinates:/i.test(t)) continue;
    // Cut at a sentence end past ~500 characters, so the fade lands between thoughts.
    if (t.length > 640) {
      const cut = t.slice(0, 640).search(/[.!?]\s[^.!?]*$/);
      return cut > 300 ? t.slice(0, cut + 1) : t.slice(0, 600) + "…";
    }
    return t;
  }
  return null;
}

/**
 * Six degrees. Two random well-linked articles; the player walks from one to the other
 * with "Draw around this", and at the end the route is set against the shortest one.
 * Everything it needs already exists -- /api/random, the recenter hook, the path view
 * -- so the game is a little state and a bar that reports it. The state is not in the
 * URL: a game is a session, not a place to link to.
 */
let game = null;

const setHtml = (id, html) => { $(id).innerHTML = html; };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function pickPair() {
  // A pair with a real gap: at least three hops apart, so neither one click nor a
  // shared hub settles it. A few tries, then whatever we have.
  const filters = `hide=${hideValue()}&minlen=${$("minlen").value}`;
  for (let attempt = 0; attempt < 6; attempt++) {
    const a = await (await fetch(`api/random?${filters}`)).json();
    const b = await (await fetch(`api/random?${filters}`)).json();
    if (a.error || b.error || a.title === b.title) continue;
    const p = await (await fetch(`api/view/path?from=${encodeURIComponent(a.title)}&to=${encodeURIComponent(b.title)}&limit=10&${filters}`)).json();
    if (p.error) continue;
    if (p.pathTitles.length - 1 >= 3 || attempt === 5) return { from: a.title, to: b.title, shortest: p.pathTitles };
  }
  return null;
}

async function startGame() {
  $("play").disabled = true;
  status("picking two articles…");
  const pair = await pickPair();
  $("play").disabled = false;
  if (!pair) { status("could not find a pair under the current filters", true); return; }
  game = { from: pair.from, to: pair.to, shortest: pair.shortest, trail: [pair.from], done: false };
  $("game").hidden = false;
  $("gameShortest").hidden = $("gameAgain").hidden = true;
  $("gameQuit").hidden = false;
  setHtml("gameResult", "");
  renderGame();
  $("view").value = "neighborhood";
  $("q").value = pair.from;
  syncControls();
  draw({ fromGame: true });
}

function endGame() {
  game = null;
  $("game").hidden = true;
}

function renderGame() {
  setHtml("gameGoal", `&#127919; Reach <b>${esc(game.to)}</b> from <b>${esc(game.from)}</b>`);
  const steps = game.trail.length - 1;
  setHtml("gameTrail", `${steps} step${steps === 1 ? "" : "s"}: ${game.trail.map(esc).join(" → ")}`);
}

function gameStep(label) {
  if (!game || game.done) return;
  if (label === game.trail[game.trail.length - 1]) return;
  game.trail.push(label);
  renderGame();
  if (label === game.to) finishGame();
}

function finishGame(gaveUp = false) {
  game.done = true;
  const yours = game.trail.length - 1, best = game.shortest.length - 1;
  const verdict = gaveUp ? `Gave up after ${yours} step${yours === 1 ? "" : "s"}.`
    : yours === best ? `&#127942; ${yours} steps — that is the shortest route.`
    : `Made it in ${yours} steps; the shortest is ${best}.`;
  setHtml("gameResult", `${verdict} Shortest: ${game.shortest.map(esc).join(" → ")}`);
  $("gameQuit").hidden = true;
  $("gameShortest").hidden = $("gameAgain").hidden = false;
}

$("play").addEventListener("click", startGame);
$("gameAgain").addEventListener("click", startGame);
$("gameClose").addEventListener("click", endGame);
$("gameShortest").addEventListener("click", () => {
  $("view").value = "path";
  $("q").value = game.from;
  $("q2").value = game.to;
  syncControls();
  draw({ fromGame: true });
});
$("gameQuit").addEventListener("click", () => finishGame(true));

// Typeahead straight off the title index, shared by both inputs.
let searchTimer;
const typeahead = (el) => () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const v = el.value.trim();
    if (v.length < 2) return;
    const kind = $("view").value === "category" ? "&kind=category" : "";
    const w = $("within").value.trim();
    const hits = await (await fetch(`api/search?q=${encodeURIComponent(v)}&hide=${hideValue()}&minlen=${$("minlen").value}&rank=${$("rank").value}${kind}` +
                                    (w && !kind ? `&within=${encodeURIComponent(w)}` : ""))).json();
    $("hits").innerHTML = hits
      .map((h) => `<option value="${h.title.replace(/_/g, " ")}">`).join("");
  }, 180);
};
$("q").addEventListener("input", typeahead($("q")));
$("q2").addEventListener("input", typeahead($("q2")));

let catTimer;
$("within").addEventListener("input", () => {
  clearTimeout(catTimer);
  catTimer = setTimeout(async () => {
    const v = $("within").value.trim();
    if (v.length < 2) return;
    const hits = await (await fetch(`api/search?q=${encodeURIComponent(v)}&kind=category`)).json();
    $("cathits").innerHTML = hits
      .map((h) => `<option value="${h.title.replace(/_/g, " ")}">`).join("");
  }, 180);
});
$("within").addEventListener("change", () => draw());

const syncControls = () => {
  const view = $("view").value;
  $("q").disabled = view === "top";
  const nbhd = ["neighborhood", "in", "out"].includes(view);
  $("hops").hidden = $("hopsLabel").hidden = !nbhd;
  const two = ["path", "common"].includes(view);
  $("q2").hidden = $("q2Label").hidden = !two;
  $("q2Label").textContent = view === "common" ? "×" : "→";
  $("q").placeholder = view === "category" ? "Physics (category name)" : "Physics";
  $("within").disabled = $("withinLabel").hidden = view === "category";
  $("within").hidden = view === "category";
};
$("view").addEventListener("change", syncControls);
$("go").addEventListener("click", draw);
$("random").addEventListener("click", async () => {
  const w = $("within").value.trim();
  const r = await (await fetch(`api/random?hide=${hideValue()}&minlen=${$("minlen").value}` +
                               (w ? `&within=${encodeURIComponent(w)}` : ""))).json();
  if (r.error) { status(r.error, true); return; }
  if (!["neighborhood", "in", "out"].includes($("view").value)) $("view").value = "neighborhood";
  $("q").value = r.title;
  syncControls();
  draw();
});
for (const id of ["q", "q2", "within"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") draw(); });
}

for (const b of hideBoxes()) {
  const n = info.kinds?.[b.value];
  if (n !== undefined) b.parentElement.title = `${n.toLocaleString()} pages`;
  b.addEventListener("change", () => draw());
}
$("mutual").addEventListener("change", () => draw());
$("minlen").addEventListener("change", () => draw());
$("group").addEventListener("change", () => draw());
$("rank").addEventListener("change", () => draw());
// Without the .rank sidecar there is nothing to choose; hide the control rather than
// offer an option that silently falls back.
if (info.pagerank === false) { $("rank").hidden = $("rankLabel").hidden = true; }
// The server's default, so a URL without minlen and the dropdown agree.
if (info.minLenDefault !== undefined && !location.hash.includes("minlen=")) {
  $("minlen").value = String(info.minLenDefault);
}

readHash();
syncControls();
draw({ push: false });

// Back and forward re-read the hash and redraw, without pushing again.
window.addEventListener("popstate", () => {
  if (readHash()) { syncControls(); draw({ push: false }); }
});
</script>
</body>
</html>
